<!doctype html>
<html lang="ru"><head><meta charset="utf-8">

<title>Tiny Island — уютный остров</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--p:#f7e9c8;--p2:#ecd6a2;--ink:#4a3620;--ed:#a97f45;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--p:#efdcb2;--p2:#dcc48c}}
:root[data-theme=dark]{--p:#efdcb2;--p2:#dcc48c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#19b8cf;font:600 14px/1.3 "Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:grab}
.pa{background:linear-gradient(160deg,var(--p),var(--p2));border:2px solid var(--ed);border-radius:14px;box-shadow:0 4px 12px #2e1e0866,inset 0 0 0 2px #fff6dc88}
button{font:inherit;color:var(--ink);cursor:pointer}
.btn{padding:8px 14px;border-radius:12px;border:2px solid var(--ed);background:linear-gradient(#fff3d2,#efd69c);box-shadow:0 3px 0 var(--ed)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ed)}
.btn:focus-visible{outline:3px solid #2b6cb0}
#top{position:fixed;top:max(8px,env(safe-area-inset-top));left:8px;right:8px;display:flex;gap:6px;align-items:flex-start;pointer-events:none}
#top>*{pointer-events:auto}
#res{display:flex;gap:6px;flex-wrap:wrap;flex:1}
.ch{padding:3px 10px;border-radius:11px;display:flex;gap:6px;align-items:center;font-size:15px}
.ch i,.card i{width:12px;height:12px;border-radius:50%;display:inline-block;border:1.5px solid #0005}
#bar{position:fixed;left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));display:flex;gap:8px;justify-content:center;pointer-events:none}
#bar button{pointer-events:auto}
#panel{position:fixed;left:8px;right:8px;bottom:calc(64px + env(safe-area-inset-bottom,0px));max-width:760px;margin:auto;padding:10px;display:none;max-height:55vh;overflow:auto}
#panel.on{display:block}
#ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-size:17px}
#ph .btn{padding:2px 12px}
#cards{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px}
.card{flex:0 0 124px;padding:6px;border-radius:12px;border:2px solid var(--ed);background:#fff6dc;text-align:center;cursor:pointer}
.card canvas{width:100%;display:block}
.card b{display:block}.card small{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:12px}
.card small span{display:flex;gap:3px;align-items:center}
.no small span.no,.no2{color:#b03a2e}
#pc p{margin:4px 0}
#pc .row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--ed)}
#toast{position:fixed;top:max(64px,calc(env(safe-area-inset-top) + 56px));left:50%;transform:translateX(-50%);padding:8px 14px;opacity:0;transition:opacity .25s;pointer-events:none;max-width:92vw;text-align:center;z-index:5}
#toast.on{opacity:1}#toast.bad{color:#8f2a1f}
#bm{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(66px + env(safe-area-inset-bottom,0px));display:none;gap:8px;align-items:center;padding:8px 10px;flex-wrap:wrap;justify-content:center;max-width:96vw}
#bm.on{display:flex}
@media(max-width:600px){.ch{font-size:13px;padding:2px 7px}.btn{padding:7px 10px}}

<div id="bar"><button class="btn" data-m="b">Строительство</button><button class="btn" data-m="q">Задания</button><button class="btn" data-m="i">Остров</button></div>
<script>
/* ===== утилиты и изометрия: мир (x,y) → экран (x-y)*32, (x+y)*16; z — высота в пикселях ===== */
const $=i=>document.getElementById(i),cv=$('c'),g=cv.getContext('2d'),N=26,CS=1.5,PI=Math.PI,KEY='tinyisland.v1';
const cl=(v,a,b)=>Math.max(a,Math.min(b,v)),iso=(x,y)=>[(x-y)*32,(x+y)*16],P=(x,y,z=0)=>{const a=iso(x,y);return[a[0],a[1]-z]};
const rnd=s=>()=>{s|=0;s=s+1831565813|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const L=(a,b,k)=>[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k];
function sh(h,k){const n=parseInt(h.slice(1),16),f=k<0?0:255,p=Math.abs(k),m=v=>Math.round((f-v)*p+v);return`rgb(${m(n>>16)},${m(n>>8&255)},${m(n&255)})`}
function poly(c,p,f,s){c.beginPath();p.forEach((q,i)=>i?c.lineTo(q[0],q[1]):c.moveTo(q[0],q[1]));c.closePath();c.fillStyle=f;c.fill();if(s){c.strokeStyle=s;c.lineWidth=1;c.stroke()}}

function circ(c,x,y,r,f,s='#1e4a24'){c.beginPath();c.arc(x,y,r,0,7);c.fillStyle=f;c.fill();c.strokeStyle=s;c.lineWidth=1.2;c.stroke()}
/* призма: левая грань светлее, правая темнее (свет сверху-слева) */
function box(c,x,y,w,h,z0,z1,col){const C=P(x+w,y+h,z1);
 poly(c,[P(x,y+h,z0),P(x+w,y+h,z0),C,P(x,y+h,z1)],sh(col,-.08),'#0003');
 poly(c,[P(x+w,y+h,z0),P(x+w,y,z0),P(x+w,y,z1),C],sh(col,-.3),'#0003');
 poly(c,[P(x,y,z1),P(x+w,y,z1),C,P(x,y+h,z1)],sh(col,.15),'#0002')}
/* вальмовая крыша с рядами черепицы */
function roof(c,x,y,w,h,z,r,col,e=.12){const ap=P(x+w/2,y+h/2,z+r),D=P(x-e,y+h+e,z),C=P(x+w+e,y+h+e,z),B=P(x+w+e,y-e,z);
 poly(c,[D,C,ap],sh(col,-.02),'#0004');poly(c,[C,B,ap],sh(col,-.26),'#0004');

function wq(c,x,y,w,h,s,u0,u1,z0,z1,col){const f=(u,z)=>s?P(x+w,y+h-u*h,z):P(x+u*w,y+h,z);poly(c,[f(u0,z0),f(u1,z0),f(u1,z1),f(u0,z1)],col,'#0005')}
const shd=(c,x,y,w,h,l=.3)=>poly(c,[P(x,y+.15),P(x+w+l,y+.15),P(x+w+l,y+h+.1),P(x,y+h+.1)],'rgba(45,35,10,.17)');

/* ===== каталог зданий ===== */

const B={
house:{n:'Дом',w:1,h:1,c:{coins:100,wood:10},p:{coins:.5},ps:1.25},
farm:{n:'Ферма',w:3,h:2,rot:1,c:{coins:150,wood:15},p:{food:.8},ps:.8},

const START=[['house',8,9],['house',10,8],['house',12,7],['church',12,11],['market',16,12],['farm',7,14],['sawmill',10,15],['well',14,16],['lighthouse',16,7],['dock',0,15]];
const fpT=(t,r)=>r&&B[t].rot?[B[t].h,B[t].w]:[B[t].w,B[t].h];
const prodT=p=>Object.keys(p).map(k=>'+'+(+p[k].toFixed(1))+' '+RN[k]).join(', ');

/* ===== отрисовка зданий (у каждого типа своя геометрия) ===== */
const DR={
house(c,x,y,w,h,t,s=0){const wc=['#f3c9a8','#f2dc9e','#ebb89a'][s%3],rc=['#d9663a','#c9552f'][s%2],a=x+.06,b=y+.06;shd(c,x,y,w,h);

church(c,x,y,w,h,t){shd(c,x,y,w,h,.9);const a=x+.1,b=y+.1;
 box(c,a,b,1.8,1.3,0,24,'#f2e2b0');wq(c,a,b,1.8,1.3,1,.2,.4,6,18,'#6aa9d6');wq(c,a,b,1.8,1.3,1,.6,.8,6,18,'#6aa9d6');roof(c,a,b,1.8,1.3,24,18,'#3f74c9',.14);
 box(c,x+.55,y+1.05,.9,.85,0,50,'#f2e2b0');wq(c,x+.55,y+1.05,.9,.85,0,.35,.65,0,16,'#7a4a2a');wq(c,x+.55,y+1.05,.9,.85,1,.3,.7,28,40,'#2a4f8a');
 const k=P(x+1,y+1.9,38);circ(c,k[0],k[1],6,'#fffbe8','#5a4630');c.beginPath();c.moveTo(k[0],k[1]-4);c.lineTo(k[0],k[1]);c.lineTo(k[0]+3,k[1]+1);c.stroke();
 roof(c,x+.55,y+1.05,.9,.85,50,34,'#3f74c9',.1);const f=P(x+1,y+1.475,84);c.strokeStyle='#5a4630';c.beginPath();c.moveTo(f[0],f[1]);c.lineTo(f[0],f[1]-16);c.stroke();poly(c,[[f[0],f[1]-16],[f[0]+11+Math.sin(t*4)*2,f[1]-13],[f[0],f[1]-9]],'#d63a30')},
lighthouse(c,x,y,w,h,t){shd(c,x,y,w,h,1.8);
 box(c,x+.05,y+.25,1.7,1.5,0,9,'#8d7b6c');box(c,x,y+1,.7,.8,0,6,'#7d6c5e');box(c,x+1.3,y+.1,.6,.7,0,14,'#9a8878');box(c,x+.3,y+.5,1.1,1,9,16,'#a08f7f');
 const[cx,cy]=P(x+1,y+1,16);
 for(let i=0;i<6;i++){const a=cy-i*14,b=a-14,r0=15-i*1.4,r1=r0-1.4;poly(c,[[cx-r0,a],[cx+r0,a],[cx+r1,b],[cx-r1,b]],i%2?'#f6f1ea':'#d63a30');poly(c,[[cx+r0*.2,a],[cx+r0,a],[cx+r1,b],[cx+r1*.2,b]],'rgba(60,20,20,.22)')}
 const ty=cy-84;ell(c,cx,ty,12,5,'#4a4a52');poly(c,[[cx-6,ty],[cx+6,ty],[cx+6,ty-15],[cx-6,ty-15]],'#bfe9f5','#0004');
 c.fillStyle=`rgba(255,226,110,${.75+.25*Math.sin(t*3)})`;c.fillRect(cx-4,ty-13,8,10);poly(c,[[cx-9,ty-15],[cx+9,ty-15],[cx,ty-30]],'#c8382e','#0004');
 c.strokeStyle='#4a4a52';c.beginPath();c.moveTo(cx,ty-30);c.lineTo(cx,ty-38);c.moveTo(cx-5,ty-36);c.lineTo(cx+5,ty-36);c.stroke()},
market(c,x,y,w,h,t){shd(c,x,y,w,h,.4);box(c,x+.1,y+.2,w-.2,h-.3,0,11,'#9a6a3a');
 const n=Math.max(4,Math.round(w*3)),cs=['#d9382c','#6cbf3c','#f0b429','#e8751a'];
 for(let i=0;i<n-1;i++)box(c,x+.18+i*(w-.5)/(n-1),y+.3,.22,.22,11,16,cs[i%4]);
 for(const[a,b]of[[x,y],[x+w-.08,y],[x,y+h+.05],[x+w-.08,y+h+.05]])box(c,a,b,.08,.08,0,30,'#7a4a2a');
 const D=P(x-.05,y+h+.15,28),C=P(x+w+.05,y+h+.15,28),A=P(x-.05,y-.05,42),Bq=P(x+w+.05,y-.05,42);
 for(let i=0;i<n;i++){const a=i/n,b=(i+1)/n,col=i%2?'#f7ead2':'#e8743a',d1=L(D,C,a),d2=L(D,C,b);poly(c,[d1,d2,L(A,Bq,b),L(A,Bq,a)],col,'#0002');poly(c,[d1,d2,[d2[0],d2[1]+6],[d1[0],d1[1]+6]],col,'#0002')}
 for(let i=0;i<3;i++)box(c,x+.12+i*(w-.4)/3,y+h+.2,.28,.28,0,9,cs[(i+1)%4])},
farm(c,x,y,w,h,t){shd(c,x,y,w,h,.1);
 const fe=(x1,y1,x2,y2)=>{const n=Math.max(1,Math.round(Math.hypot(x2-x1,y2-y1)*2));c.strokeStyle='#7a4a2a';c.lineCap='round';c.lineWidth=3;c.beginPath();for(let i=0;i<=n;i++){const a=x1+(x2-x1)*i/n,b=y1+(y2-y1)*i/n,p=P(a,b),q=P(a,b,10);c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1])}c.stroke();c.lineWidth=2;c.beginPath();for(const z of[4,8]){const p=P(x1,y1,z),q=P(x2,y2,z);c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1])}c.stroke()};
 fe(x,y,x+w,y);fe(x,y,x,y+h);poly(c,[P(x,y,1),P(x+w,y,1),P(x+w,y+h,1),P(x,y+h,1)],'#8a5a34');
 const n=Math.round(w*2),wd=(w-.2)/n;
 for(let i=0;i<n;i++){const xa=x+.1+i*wd,gold=i%2,col=gold?'#e0b23e':'#5aa23a';
  poly(c,[P(xa+.07,y+.15,2),P(xa+wd-.07,y+.15,2),P(xa+wd-.07,y+h-.15,2),P(xa+.07,y+h-.15,2)],gold?'#c9962c':'#3f7f2c');
  c.strokeStyle=col;c.lineWidth=3;c.beginPath();for(let j=0;j<h*4-1;j++){const p=P(xa+wd/2,y+.25+j*.25,2),q=P(xa+wd/2+Math.sin(t*2+j+i)*.02,y+.25+j*.25,9);c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1])}c.stroke()}
 fe(x,y+h,x+w,y+h);fe(x+w,y,x+w,y+h)},
sawmill(c,x,y,w,h,t){shd(c,x,y,w,h,.5);poly(c,[P(x,y,1),P(x+w,y,1),P(x+w,y+h,1),P(x,y+h,1)],'#c9a06a');
 box(c,x+.1,y+.1,1.2,.12,0,26,'#9a6a3a');box(c,x+.25,y+.35,.8,.7,0,12,'#dba965');
 for(const[a,b]of[[.1,1.25],[1.2,1.25],[1.2,.1],[.1,.1]])box(c,x+a,y+b,.1,.1,0,28,'#7a4a2a');
 roof(c,x,y,1.4,1.4,28,14,'#c8582f',.08);
 const bx=P(x+1.55,y+1.1);c.lineCap='round';
 for(let r=0;r<3;r++)for(let i=0;i<3-r;i++){const cx=bx[0]+(i-(2-r)/2)*8-6,cy=bx[1]-r*7;c.strokeStyle='#9c6a38';c.lineWidth=8;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+14,cy+7);c.stroke();circ(c,cx,cy,4,'#e0b070','#7a4a2a')}},
well(c,x,y,w,h,t){shd(c,x,y,w,h,.3);const[cx,cy]=P(x+.5,y+.5);
 box(c,x+.1,y+.1,.08,.08,0,34,'#7a4a2a');box(c,x+.82,y+.1,.08,.08,0,34,'#7a4a2a');
 poly(c,[[cx-15,cy-3],[cx+15,cy-3],[cx+15,cy-15],[cx-15,cy-15]],'#9ea0a4');ell(c,cx,cy-3,15,7.5,'#8a8c90');
 for(let i=0;i<4;i++)c.strokeStyle='#0003',c.beginPath(),c.moveTo(cx-15+i*10,cy-3+(i%2?3:2)),c.lineTo(cx-15+i*10,cy-15),c.stroke();
 ell(c,cx,cy-15,15,7.5,'#c3c5c8');ell(c,cx,cy-15,11,5.2,'#3b8fc8');
 box(c,x+.1,y+.82,.08,.08,0,34,'#7a4a2a');box(c,x+.82,y+.82,.08,.08,0,34,'#7a4a2a');roof(c,x+.1,y+.1,.8,.8,34,11,'#a8602f',.16)},
dock(c,x,y,w,h,t){const z=7,n=Math.round(Math.max(w,h)*3);box(c,x,y,w,h,z-3,z,'#a8703c');
 for(let i=0;i<n;i++){const a=i/n,b=(i+1)/n,col=i%2?'#c88d50':'#b97e44';poly(c,w>=h?[P(x+w*a,y,z),P(x+w*b,y,z),P(x+w*b,y+h,z),P(x+w*a,y+h,z)]:[P(x,y+h*a,z),P(x+w,y+h*a,z),P(x+w,y+h*b,z),P(x,y+h*b,z)],col,'#5a381a55')}
 for(const[a,b]of[[x,y],[x+w-.15,y],[x,y+h-.15],[x+w-.15,y+h-.15]])box(c,a,b,.15,.15,-8,z+9,'#6b4423');
 const bb=Math.sin(t*2+x)*1.6,o=P(x+w*.5,y+h+.9,-2+bb),q=(a)=>a.map(p=>[o[0]+p[0],o[1]+p[1]]);
 poly(c,q([[-22,-9],[26,15],[16,19],[-14,2]]),'#8a5a2b','#3a2410');poly(c,q([[-19,-8],[22,13],[16,15],[-12,2]]),'#c79a5c');poly(c,q([[-14,2],[16,19],[14,22],[-14,5]]),'#3b6fc4');
 c.strokeStyle='#6b4423';c.lineWidth=2;c.beginPath();c.moveTo(o[0]-4,o[1]-2);c.lineTo(o[0]-16,o[1]+10);c.moveTo(o[0]+6,o[1]+4);c.lineTo(o[0]-6,o[1]+16);c.stroke()}};

/* ===== окружение ===== */
const DE={
tree(c,e,t){const[p,q]=P(e.x,e.y),s=e.s,w=Math.sin(t*1.5+e.ph)*1.6;ell(c,p+12*s,q+2,20*s,7*s,'rgba(45,35,10,.17)');c.fillStyle='#7a4f2a';c.fillRect(p-3*s,q-18*s,6*s,18*s);
 circ(c,p-9*s+w*.4,q-26*s,12*s,'#2f7d32');circ(c,p+9*s+w*.4,q-28*s,11*s,'#2f7d32');circ(c,p+w,q-38*s,14*s,'#3f9a3a');circ(c,p-4*s+w,q-42*s,7*s,'#62b84c')},
pine(c,e,t){const[p,q]=P(e.x,e.y),s=e.s,w=Math.sin(t*1.4+e.ph)*1.2;ell(c,p+12*s,q+2,18*s,6*s,'rgba(45,35,10,.17)');c.fillStyle='#6b4423';c.fillRect(p-3*s,q-10*s,6*s,10*s);
 for(let i=0;i<4;i++){const y0=q-8*s-i*13*s,wd=(22-i*4.5)*s,o=w*i*.25;poly(c,[[p-wd+o,y0],[p+wd+o,y0],[p+o+w*.3,y0-22*s]],i%2?'#2f6f3a':'#3a8044','#173b20')}},

function canPlace(t,x,y,w,h){const d=B[t];

 for(let i=parts.length-1;i>=0;i--){const q=parts[i];q.a+=dt;if(q.dust){q.y-=4*dt}else{q.y-=12*dt;q.x+=4*dt}if(q.a>(q.dust?.7:3))parts.splice(i,1)}
 for(const n of npcs){if(!free(Math.floor(n.x),Math.floor(n.y))){const f=freeCells();if(f.length){const q=f[Math.random()*f.length|0];n.x=n.tx=q[0]+.5;n.y=n.ty=q[1]+.5}continue}
  const dx=n.tx-n.x,dy=n.ty-n.y,d=Math.hypot(dx,dy);
  if(d<.05){n.w-=dt;if(n.w>0)continue;const fi=Math.floor(n.x),fj=Math.floor(n.y);

    if(free(i,j)&&(!dr[0]||!dr[1]||free(i,fj)&&free(fi,j))){n.tx=i+.5+(Math.random()-.5)*.3;n.ty=j+.5+(Math.random()-.5)*.3;n.d=dr;n.w=Math.random()*.8;break}}}
  else{const s=Math.min(1,n.sp*dt/d);n.x+=dx*s;n.y+=dy*s}}}

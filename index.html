  }
  // праздник урожая
  S.festival=120;
  toast('Праздник урожая! Фермы работают вдвое быстрее 2 минуты.', 'gold');
  addChron('Праздник урожая: фермы ускорены на 2 минуты.');
  Sound.quest(); updateResBar(); saveSoon();
}
function afterChange(){ ensureDaily(); updateResBar(); renderQuests(); checkLevel(); checkDaily(); if(popCapacity(S)>S.stats.peakPop){ S.stats.peakPop=popCapacity(S); } saveSoon(); }

/* ---------- живые детали мира: птицы, рыбы, бабочки, светлячки ---------- */
function initCritters(){
  fireflies=[]; butterflies=[];
  const grass=[]; S.cells.forEach((c,i)=>{ if(c.t==='grass'&&!c.b) grass.push(i); });
  for(let i=0;i<22&&grass.length;i++){ const idx=grass[(Math.random()*grass.length)|0]; const [x,y]=idxXY(idx);
    fireflies.push({x:(x+Math.random())*T, y:(y+Math.random())*T, ph:Math.random()*7, sp:.4+Math.random()*.8}); }
  for(let i=0;i<3&&grass.length;i++){ const idx=grass[(Math.random()*grass.length)|0]; const [x,y]=idxXY(idx);
    butterflies.push({x:(x+.5)*T, y:(y+.3)*T, ph:Math.random()*7, home:[(x+.5)*T,(y+.3)*T]}); }
  stars=[]; for(let i=0;i<110;i++) stars.push({x:Math.random(), y:Math.random()*.72, r:.6+Math.random()*1.3, ph:Math.random()*7});
}
function updateCritters(dt){
  // птицы: пролетают через мир
  if(Math.random()<dt*0.14 && birds.length<3){ const dir=Math.random()<.5?1:-1;
    birds.push({x: dir>0? -60 : WORLD_W+60, y: 40+Math.random()*WORLD_H*.5, v: dir*(46+Math.random()*30), ph:Math.random()*7}); }
  for(let i=birds.length-1;i>=0;i--){ const b=birds[i]; b.x+=b.v*dt; b.y+=Math.sin(worldTime*2+b.ph)*6*dt; if(b.x<-90||b.x>WORLD_W+90) birds.splice(i,1); }
  // всплески рыб у берега
  if(Math.random()<dt*0.5 && splashes.length<5){
    const shore=[]; S.cells.forEach((c,i)=>{ if(c.t!=='water') return; const [x,y]=idxXY(i);
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n=cellAt(x+dx,y+dy); if(n&&n.t!=='water'){ shore.push(i); break; } } });
    if(shore.length){ const idx=shore[(Math.random()*shore.length)|0]; const [x,y]=idxXY(idx);
      splashes.push({x:(x+.5)*T, y:(y+.5)*T, t:0}); } }
  for(let i=splashes.length-1;i>=0;i--){ splashes[i].t+=dt; if(splashes[i].t>1.1) splashes.splice(i,1); }
  // бабочки кружат у дома
  for(const bf of butterflies){ bf.ph+=dt*2.2; bf.x=bf.home[0]+Math.sin(bf.ph*.7)*22; bf.y=bf.home[1]+Math.cos(bf.ph)*9-4; }
  // светлячки блуждают
  for(const f of fireflies){ f.ph+=dt*f.sp; f.x+=Math.sin(f.ph*1.7)*7*dt; f.y+=Math.cos(f.ph*1.3)*5*dt; }
}
function drawCritters(g){
  // всплески рыб
  for(const s of splashes){ const p=s.t/1.1; g.strokeStyle='rgba(255,255,255,'+(0.65*(1-p))+')'; g.lineWidth=1.6;
    g.beginPath(); g.ellipse(s.x, s.y, 4+p*15, (4+p*15)*.45, 0, 0, 7); g.stroke();
    if(p<.4){ g.fillStyle='rgba(190,225,240,.9)'; g.beginPath(); g.arc(s.x, s.y-4-p*8, 2.2, 0, 7); g.fill(); } }
  // бабочки
  for(const bf of butterflies){ const w=Math.abs(Math.sin(worldTime*10+bf.ph))*3.4;
    g.fillStyle='#e86a92'; g.beginPath(); g.ellipse(bf.x-2.4, bf.y, w, 2.6, -.5, 0, 7); g.ellipse(bf.x+2.4, bf.y, w, 2.6, .5, 0, 7); g.fill();
    g.fillStyle='#4a3620'; g.fillRect(bf.x-.6, bf.y-2.6, 1.2, 5); }
  // птицы
  g.strokeStyle='rgba(60,60,70,.75)'; g.lineWidth=2; g.lineCap='round';
  for(const b of birds){ const f=Math.sin(worldTime*9+b.ph)*4;
    g.beginPath(); g.moveTo(b.x-8, b.y-f); g.quadraticCurveTo(b.x-3, b.y+2, b.x, b.y); g.quadraticCurveTo(b.x+3, b.y+2, b.x+8, b.y-f); g.stroke(); }
}

/* ============================================================
   РЕНДЕР
   ============================================================ */
function render(){
  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#5ea7c4'; ctx.fillRect(0,0,VW,VH);
  // фактор ночи по фазе суток: полдень — 0, полночь — 1
  const sunA=Math.cos((S.dayPhase-0.25)*Math.PI*2);
  nightF=clamp((1-sunA)/2*1.25-0.12, 0, 1);
  ctx.save();
  ctx.translate(VW/2,VH/2); ctx.scale(S.cam.z,S.cam.z); ctx.translate(-S.cam.x,-S.cam.y);
  // видимая область мира
  const x0=clamp(S.cam.x-(VW/2)/S.cam.z-60,0,WORLD_W), y0=clamp(S.cam.y-(VH/2)/S.cam.z-60,0,WORLD_H);
  const x1=clamp(S.cam.x+(VW/2)/S.cam.z+60,0,WORLD_W), y1=clamp(S.cam.y+(VH/2)/S.cam.z+60,0,WORLD_H);
  ctx.drawImage(terrainCanvas, x0,y0,x1-x0,y1-y0, x0,y0,x1-x0,y1-y0);
  drawWaterFx(ctx);
  // тени облаков
  ctx.fillStyle='rgba(30,50,60,.10)';
  for(const cl of clouds){ ctx.beginPath(); ctx.ellipse(cl.x+36, cl.y+52, 90*cl.s, 30*cl.s, 0, 0, 7); ctx.fill(); }
  // подсветка наведения / выбора
  if(hoverIdx>=0&&tool){ const [hx,hy]=idxXY(hoverIdx); ctx.fillStyle= canPlace(tool,hoverIdx)&&canAfford(BUILDS[tool].cost)? 'rgba(120,220,90,.35)':'rgba(220,80,60,.35)'; ctx.fillRect(hx*T+2,hy*T+2,T-4,T-4); }
  if(selIdx>=0){ const [sx,sy]=idxXY(selIdx); ctx.strokeStyle='rgba(255,246,200,.95)'; ctx.lineWidth=2.4/S.cam.z; ctx.setLineDash([7,5]); ctx.strokeRect(sx*T+2,sy*T+2,T-4,T-4); ctx.setLineDash([]); }
  // объекты построчно (сортировка по y — через проход по рядам)
  for(let y=0;y<H;y++){
    for(let x=0;x<W;x++){
      const wx=x*T, wy=y*T; if(wx<x0-T||wx>x1||wy<y0-T||wy>y1) continue;
      const c=S.cells[y*W+x]; const cx=wx+T/2, cy=wy+T/2; const ci=y*W+x;
      if(c.n){ if(c.nh>0){ if(c.n==='tree'){ const img=spriteCache['tree_'+(c.v%3)+'_'+(c.v%5)];
            if(img){ ctx.save(); ctx.translate(cx, cy+14); ctx.rotate(Math.sin(worldTime*1.3+c.v)*0.028); ctx.drawImage(img,-48,-58); ctx.restore(); }
            else drawTreeSprite(ctx, c.v%3, cx, cy+14, 1, c.v, worldTime*1.3); }
          else if(c.n==='bush'){ const img=spriteCache['bush_1']; if(img) ctx.drawImage(img, cx-48, cy-26); else drawBushSprite(ctx, cx, cy+14, 1, c.v, true); }
          else { const img=spriteCache[c.nh>=3?'rock_0':'rock_c']; if(img) ctx.drawImage(img, cx-48, cy-36); else drawRockSprite(ctx, cx, cy+14, 1, c.v, c.nh>=3?0:1); } }
        else if(c.n==='tree'){ const img=spriteCache['stump']; if(img) ctx.drawImage(img, cx-32, cy-10); else drawStump(ctx,cx,cy+14,1); }
        else if(c.n==='bush'){ const img=spriteCache['bush_0']; if(img) ctx.drawImage(img, cx-48, cy-26); else drawBushSprite(ctx,cx,cy+14,.92,c.v,false); }
        else { const img=spriteCache['rock_1']; if(img) ctx.drawImage(img, cx-48, cy-36); else drawRockSprite(ctx,cx,cy+14,.8,c.v,2); } }
      if(c.b){ drawCachedBuilding(c.b.type, c.b.level, cx, cy, ci); if(c.b.damaged) drawDamagedFx(cx, cy, c.v); drawNightGlow(c, cx, cy);
        if(c.b.type==='farm') drawFarmCrops(ctx, c.b, cx, cy, 1, worldTime);
        if(c.b.type==='house'&&c.b.level>=1){ // дым из трубы
          if(Math.random()<.06) smoke.push({x:cx+12, y:cy-18, life:0}); }
        if(isProducer(c.b.type)&&!c.b.damaged){ // кольцо прогресса; готово — полное зелёное кольцо с галочкой ✓
          const def=prodDef(c.b.type,c.b.level); const p=c.b.ready?1:c.b.prog/def.cycle;
          ctx.strokeStyle='rgba(60,40,16,.35)'; ctx.lineWidth=3.4; ctx.beginPath(); ctx.arc(cx, cy-24, 10, 0, 7); ctx.stroke();
          ctx.strokeStyle= c.b.ready? '#5d8a48':'#f2c14e'; ctx.beginPath(); ctx.arc(cx, cy-24, 10, -Math.PI/2, -Math.PI/2+p*Math.PI*2); ctx.stroke();
          if(c.b.ready){ ctx.fillStyle='#3d6128'; ctx.font='700 11px Rubik'; ctx.textAlign='center'; ctx.fillText('✓', cx, cy-20.5); } }
        if(c.b&&c.b.damaged){ const bob=Math.sin(worldTime*5+x)*1.6;
          ctx.fillStyle='#b03a2e'; ctx.strokeStyle='#ffeeda'; ctx.lineWidth=1.4;
          ctx.beginPath(); ctx.arc(cx, cy-34+bob, 8.4, 0, 7); ctx.fill(); ctx.stroke();
          ctx.fillStyle='#ffeeda'; ctx.font='700 12px Rubik'; ctx.textAlign='center'; ctx.fillText('!', cx, cy-30+bob); }
        if(c.b&&c.nr>0){}
        if(c.n&&c.nh<=0&&c.nr>0){ ctx.fillStyle='rgba(255,248,220,.9)'; ctx.font='600 11px Rubik'; ctx.textAlign='center'; ctx.fillText(Math.ceil(c.nr)+' c', cx, cy-16); }
      } else if(c.n&&c.nh<=0&&c.nr>0){ ctx.fillStyle='rgba(255,248,220,.9)'; ctx.font='600 11px Rubik'; ctx.textAlign='center'; ctx.fillText(Math.ceil(c.nr)+' c', cx, cy-16); }
    }
    // человечки этого ряда
    for(const a of agents){ if(((a.y/T)|0)===y) drawAgent(ctx,a,worldTime); }
  }
  // лучи маяков ночью
  if(nightF>0.22){
    for(let i=0;i<S.cells.length;i++){ const c=S.cells[i]; if(!c.b||c.b.type!=='lighthouse'||c.b.damaged) continue;
      const [lx,ly]=idxXY(i); const bx=(lx+.5)*T, by=(ly+.5)*T-17;
      for(const dirn of [0, Math.PI]){ const a=worldTime*0.65 + c.v + dirn;
        ctx.save(); ctx.translate(bx,by); ctx.rotate(a);
        const gr=ctx.createLinearGradient(0,0,190,0); gr.addColorStop(0,'rgba(255,230,150,'+(0.34*nightF)+')'); gr.addColorStop(1,'rgba(255,230,150,0)');
        ctx.fillStyle=gr; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(190,-26); ctx.lineTo(190,26); ctx.closePath(); ctx.fill(); ctx.restore(); } }
  }
  drawCritters(ctx);
  // светлячки над травой ночью
  if(nightF>0.45){ for(const f of fireflies){ const a=(0.35+0.65*Math.abs(Math.sin(worldTime*1.4+f.ph)))*nightF;
      ctx.fillStyle='rgba(220,255,150,'+a+')'; ctx.beginPath(); ctx.arc(f.x, f.y, 2.1, 0, 7); ctx.fill();
      ctx.fillStyle='rgba(220,255,150,'+(a*.25)+')'; ctx.beginPath(); ctx.arc(f.x, f.y, 5.5, 0, 7); ctx.fill(); } }
  // призрак постройки
  if(tool&&hoverIdx>=0){ const [hx,hy]=idxXY(hoverIdx); const img=spriteCache['b_'+tool+'_1']; ctx.globalAlpha=.55;
    if(img) ctx.drawImage(img, hx*T+T/2-60, hy*T+T/2-64); else drawBuildingSprite(ctx, tool, 1, hx*T+T/2, hy*T+T/2, 1, 3, worldTime); ctx.globalAlpha=1; }
  if(moveFrom>=0&&S.cells[moveFrom]&&S.cells[moveFrom].b&&hoverIdx>=0){ const [hx,hy]=idxXY(hoverIdx);
    const mb=S.cells[moveFrom].b, img=spriteCache['b_'+mb.type+'_'+mb.level]; ctx.globalAlpha=.55;
    if(img) ctx.drawImage(img, hx*T+T/2-60, hy*T+T/2-64); else drawBuildingSprite(ctx, mb.type, mb.level, hx*T+T/2, hy*T+T/2, 1, 3, worldTime); ctx.globalAlpha=1; }
  // дым
  for(const p of smoke){ ctx.fillStyle='rgba(245,245,245,'+(0.5-p.life*.14)+')'; ctx.beginPath(); ctx.arc(p.x+p.life*4, p.y-p.life*9, 3+p.life*2.4, 0, 7); ctx.fill(); }
  // частицы
  for(const p of particles){ ctx.save(); ctx.globalAlpha=1-p.life/p.max; ctx.translate(p.x,p.y); ctx.rotate(p.rot);
    ctx.fillStyle=p.color; if(p.shape==='rect') ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.66);
    else if(p.shape==='leaf'){ ctx.beginPath(); ctx.ellipse(0,0,p.size,p.size*.55,0,0,7); ctx.fill(); }
    else { ctx.beginPath(); ctx.arc(0,0,p.size/1.6,0,7); ctx.fill(); } ctx.restore(); }
  // всплывающий текст
  ctx.font='700 15px Rubik'; ctx.textAlign='center';
  for(const f of floaters){ ctx.globalAlpha=1-f.life/1.4; ctx.fillStyle=f.color; ctx.strokeStyle='rgba(60,40,10,.6)'; ctx.lineWidth=3; ctx.strokeText(f.txt,f.x,f.y-f.life*30); ctx.fillText(f.txt,f.x,f.y-f.life*30); }
  ctx.globalAlpha=1;
  // дождь
  if(rain.active){ ctx.strokeStyle='rgba(220,240,255,.55)'; ctx.lineWidth=1.4; ctx.beginPath();
    for(let i=0;i<70;i++){ const rx=x0+((i*197.3+worldTime*620)%(x1-x0)), ry=y0+((i*131.7+worldTime*880)%(y1-y0)); ctx.moveTo(rx,ry); ctx.lineTo(rx-4,ry+13); } ctx.stroke(); }
  ctx.restore();
  // облака поверх мира
  ctx.save(); ctx.translate(VW/2,VH/2); ctx.scale(S.cam.z,S.cam.z); ctx.translate(-S.cam.x,-S.cam.y);
  for(const cl of clouds){ ctx.fillStyle='rgba(255,255,255,.85)';
    [[0,0,34],[26,4,24],[-26,5,22],[8,-9,22]].forEach(b=>{ ctx.beginPath(); ctx.arc(cl.x+b[0]*cl.s, cl.y+b[1]*cl.s, b[2]*cl.s, 0, 7); ctx.fill(); }); }
  ctx.restore();
  // цикл дня и ночи: тёплые сумерки, ночная синева, звёзды и луна
  const ph=S.dayPhase;
  const dusk=Math.max(0, 1-Math.abs(sunA)/0.45);
  if(dusk>0 && nightF<0.85){ ctx.fillStyle='rgba(255,140,70,'+(0.10*dusk)+')'; ctx.fillRect(0,0,VW,VH); }
  if(nightF>0.03){
    ctx.fillStyle='rgba(12,18,52,'+(0.46*nightF)+')'; ctx.fillRect(0,0,VW,VH);
    if(nightF>0.35){ // звёзды
      for(const st of stars){ const tw=.55+.45*Math.sin(worldTime*1.8+st.ph);
        ctx.fillStyle='rgba(255,255,240,'+(0.85*nightF*tw)+')'; ctx.beginPath(); ctx.arc(st.x*VW, st.y*VH, st.r, 0, 7); ctx.fill(); }
      // луна путешествует по ночному небу
      const mt=clamp((ph-0.52)/0.44, 0, 1);
      const mx=lerp(VW*0.12, VW*0.88, mt), my=VH*0.30-Math.sin(mt*Math.PI)*VH*0.13;
      ctx.fillStyle='rgba(240,240,215,'+(0.28*nightF)+')'; ctx.beginPath(); ctx.arc(mx,my,25,0,7); ctx.fill();
      ctx.fillStyle='#f2eed8'; ctx.beginPath(); ctx.arc(mx,my,15,0,7); ctx.fill();
      ctx.fillStyle='rgba(12,18,52,'+(0.46*nightF)+')'; ctx.beginPath(); ctx.arc(mx+6,my-4,12.5,0,7); ctx.fill();
      ctx.fillStyle='rgba(200,195,170,.5)'; ctx.beginPath(); ctx.arc(mx-4,my+5,2.4,0,7); ctx.arc(mx+2,my-7,1.7,0,7); ctx.fill();
      // лунная дорожка на воде — дрожащие блики под луной
      ctx.fillStyle='rgba(240,240,210,'+(0.13*nightF)+')';
      for(let k=0;k<9;k++){ const ry=my+34+k*((VH-my-60)/9), rw=6+((k*37)%13)+Math.sin(worldTime*1.7+k*1.9)*3;
        ctx.beginPath(); ctx.ellipse(mx+Math.sin(worldTime+k*2.3)*4, ry, rw, 1.7, 0, 0, 7); ctx.fill(); }
    }
  }
  // мягкая виньетка по краям кадра
  if(!vigGrad||vigW!==VW||vigH!==VH){ vigGrad=ctx.createRadialGradient(VW/2,VH/2, Math.min(VW,VH)*.40, VW/2,VH/2, Math.max(VW,VH)*.76);
    vigGrad.addColorStop(0,'rgba(22,30,44,0)'); vigGrad.addColorStop(1,'rgba(22,30,44,.20)'); vigW=VW; vigH=VH; }
  ctx.fillStyle=vigGrad; ctx.fillRect(0,0,VW,VH);
  drawMinimap();
}
function drawWaterFx(g){
  const t=worldTime;
  // бегущая пена по берегам
  g.strokeStyle='rgba(255,255,255,.5)'; g.lineWidth=2;
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const c=S.cells[y*W+x]; if(c.t==='water') continue;
    const cx=x*T, cy=y*T;
    const ph=Math.sin(t*1.6 + (x+y)*.9)*2.2;
    g.beginPath();
    if(cellAt(x,y-1)&&cellAt(x,y-1).t==='water'){ g.moveTo(cx+5, cy-3+ph); g.quadraticCurveTo(cx+T/2, cy-6+ph, cx+T-5, cy-3+ph); }
    if(cellAt(x,y+1)&&cellAt(x,y+1).t==='water'){ g.moveTo(cx+5, cy+T+3-ph); g.quadraticCurveTo(cx+T/2, cy+T+6-ph, cx+T-5, cy+T+3-ph); }
    if(cellAt(x-1,y)&&cellAt(x-1,y).t==='water'){ g.moveTo(cx-3+ph, cy+6); g.quadraticCurveTo(cx-6+ph, cy+T/2, cx-3+ph, cy+T-6); }
    if(cellAt(x+1,y)&&cellAt(x+1,y).t==='water'){ g.moveTo(cx+T+3-ph, cy+6); g.quadraticCurveTo(cx+T+6-ph, cy+T/2, cx+T+3-ph, cy+T-6); }
    g.stroke();
  }
  // блики
  g.fillStyle='rgba(255,255,255,.35)';
  for(let i=0;i<26;i++){ const bx=((i*173.3+Math.sin(t*.7+i)*14)%WORLD_W+WORLD_W)%WORLD_W, by=((i*251.7)%WORLD_H+H)%WORLD_H;
    const ci=((by/T)|0)*W+((bx/T)|0); if(S.cells[ci]&&S.cells[ci].t==='water'&&Math.sin(t*1.3+i*2.1)>0.3){ g.beginPath(); g.ellipse(bx,by,7,1.8,0,0,7); g.fill(); } }
}
function drawMinimap(){
  const mc=$('minimap'); if(!mc||mc.offsetParent===null&&VW<=760) { }
  const g=mc.getContext('2d'); const mw=mc.width, mh=mc.height; const sx=mw/WORLD_W, sy=mh/WORLD_H;
  g.fillStyle='#5ea7c4'; g.fillRect(0,0,mw,mh);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const c=S.cells[y*W+x]; if(c.t==='water') continue;
    g.fillStyle= c.t==='sand'? '#e7cd8d':'#71ad4f'; g.fillRect(x*T*sx, y*T*sy, T*sx+1, T*sy+1);
    if(c.b){ g.fillStyle= c.b.type==='house'?'#b3543f': c.b.type==='lighthouse'?'#f2c14e':'#6d5133'; g.fillRect(x*T*sx+1, y*T*sy+1, T*sx-2, T*sy-2); } }
  const vwpx=(VW/S.cam.z)*sx, vhpx=(VH/S.cam.z)*sy;
  g.strokeStyle='#fff6dc'; g.lineWidth=1.6; g.strokeRect(S.cam.x*sx-vwpx/2, S.cam.y*sy-vhpx/2, vwpx, vhpx);
}

/* ============================================================
   ОБНОВЛЕНИЕ МИРА
   ============================================================ */
let lastTs=0, autosaveT=0, happyT=0, fxT=0;
function loop(ts){
  requestAnimationFrame(loop);
  const dt=Math.min(.05,(ts-lastTs)/1000||0.016); lastTs=ts;
  worldTime+=dt;
  // время суток и игровые дни: полный цикл — 6 минут
  const prevPhase=S.dayPhase;
  S.dayPhase+=dt/360;
  if(S.dayPhase>=1){ S.dayPhase-=1; S.gameDay++; addChron('Наступил день '+S.gameDay+' ('+SEASONS[seasonIdx()]+').'); }
  // смена сезона: автоматически по дням или вручную
  const si=seasonIdx();
  if(si!==curSeason){ curSeason=si; buildTerrain(); initCritters();
    if(S.lastSeason!==-1){ toast('Наступил сезон: '+SEASONS[si], 'gold'); addChron('Смена сезона: '+SEASONS[si]+'.'); }
    if(si===3&&!S.seenWinter){ S.seenWinter=true; }
    S.lastSeason=si; checkAchs(); saveSoon(); }
  if(S.dayPhase<prevPhase-0.5){ /* новый день обработан выше */ }
  // инерция камеры
  if(!dragging){ S.cam.x+=camVX*dt*8; S.cam.y+=camVY*dt*8; camVX*=Math.pow(.0018,dt); camVY*=Math.pow(.0018,dt); if(Math.abs(camVX)<.01)camVX=0; if(Math.abs(camVY)<.01)camVY=0; }
  clampCam();
  // производство и восстановление
  const hm=happyMult(S);
  for(const c of S.cells){
    if(c.n&&c.nh<=0&&c.nr>0){ c.nr-=dt; if(c.nr<=0){ c.nh= c.n==='bush'?1:3; c.nr=0; } }
    if(c.b){ const b=c.b, d=BUILDS[b.type];
      if(isProducer(b.type)&&!b.ready&&!b.damaged){
        let mult=hm*cycleMult(S,c);
        if(rain.active&&b.type==='farm') mult*=1.8;
        if(b.type==='farm'&&S.festival>0) mult*=2;
        b.prog+=dt*mult; const def=prodDef(b.type,b.level); const cyc=def.cycle;
        if(b.prog>=cyc){ b.prog=cyc; b.ready=true; } }
      if(b.type==='pier'&&!b.damaged){ b.pt=(b.pt||0)+dt; if(b.pt>=d.passive){ b.pt=0; const i=S.cells.indexOf(c); const [x,y]=idxXY(i); if(addRes('fish',2,(x+.5)*T,(y+.5)*T)>0){ updateResBar(); checkDaily(); } } }
      if(b.type==='garden'&&!b.damaged){ b.pt=(b.pt||0)+dt; if(b.pt>=d.passive){ b.pt=0; const i=S.cells.indexOf(c); const [x,y]=idxXY(i); if(addRes('berries',2,(x+.5)*T,(y+.5)*T)>0){ updateResBar(); checkDaily(); } } }
    }
  }
  // праздник урожая — обратный отсчёт
  if(S.festival>0){ S.festival-=dt; if(S.festival<=0){ S.festival=0; updateResBar(); } }
  // случайные события
  S.nextEvent-=dt;
  if(S.nextEvent<=0){ S.nextEvent=170+Math.random()*140; fireEvent(); }
  // торговец
  if(S.trader){ S.trader.t-=dt; const dot=$('trader-dot'); if(dot) dot.textContent=Math.max(0,Math.ceil(S.trader.t));
    if(S.trader.t<=0){ traderLeave(false); if($('modalwrap').classList.contains('open')&&$('modal').dataset.kind==='trader') closeModal(); } }
  else if(countB(S,'pier')>0){ S.traderT-=dt; if(S.traderT<=0){ S.traderT=290+Math.random()*60; traderArrive(); } }
  // счастье — пересчёт раз в секунду
  happyT+=dt;
  if(happyT>1){ happyT=0; const h=happinessCalc(S).value; if(h!==S.happy){ S.happy=h; updateResBar(); } if(S.happy>=90) checkAchs(); }
  // погода
  rain.t-=dt;
  if(!rain.active&&rain.t<=0){ rain.active=true; rain.t=16+Math.random()*10; Sound.rainStart(); toast('Пошёл дождь — фермы растут быстрее!'); }
  else if(rain.active&&rain.t<=0){ rain.active=false; rain.t=60+Math.random()*80; Sound.rainStop(); }
  // сезонные частицы: листопад осенью, снег зимой
  fxT+=dt;
  if(fxT>0.4){ fxT=0;
    if(curSeason===2) burst(S.cam.x+(Math.random()-.5)*VW/S.cam.z, S.cam.y-VH/2/S.cam.z-10, 'leaf', 2);
    if(curSeason===3){ particles.push({x:S.cam.x+(Math.random()-.5)*VW/S.cam.z, y:S.cam.y-VH/2/S.cam.z-8, vx:8, vy:26, life:0, max:2.6, color:'#ffffff', size:2.4, grav:-4, shape:'dot', rot:0}); }
  }
  updateCritters(dt);
  // облака
  for(const cl of clouds){ cl.x+=cl.v*dt; if(cl.x-120>WORLD_W){ cl.x=-120; cl.y=Math.random()*WORLD_H; } }
  // частицы/текст/дым
  for(let i=particles.length-1;i>=0;i--){ const p=particles[i]; p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=p.grav*dt; p.rot+=dt*3; if(p.life>=p.max) particles.splice(i,1); }
  for(let i=floaters.length-1;i>=0;i--){ floaters[i].life+=dt; if(floaters[i].life>1.4) floaters.splice(i,1); }
  for(let i=smoke.length-1;i>=0;i--){ smoke[i].life+=dt; if(smoke[i].life>3.4) smoke.splice(i,1); }
  updateAgents(dt);
  render();
  autosaveT+=dt; if(autosaveT>5){ autosaveT=0; save(); }
}
function clampCam(){
  const m=190;
  S.cam.x=clamp(S.cam.x, -m, WORLD_W+m); S.cam.y=clamp(S.cam.y, -m, WORLD_H+m);
  S.cam.z=clamp(S.cam.z,.7,1.6);
}

/* ---------- генеративная музыка и амбиент (поверх аудиодвижка) ----------
   Музыка: «блуждание» по пентатонике ля-минор (A C D E G) в трёх октавах —
   шаг −2..+2 с притяжением к центру шкалы, редкий бас и подголосок.
   Амбиент: постоянный тихий прибой + волны, чайки, птицы днём, шелест листвы. */
const Music={
  started:false, step:7, waveGain:null,
  scale:(()=>{ const base=[220,261.63,293.66,329.63,392], out=[]; for(const o of [.5,1,2]) for(const f of base) out.push(f*o); return out; })(),
  start(){
    if(this.started||!Sound.ctx) return; this.started=true;
    const c=Sound.ctx;
    // постоянный тихий прибой: зацикленный коричневый шум через lowpass на ambient-шину
    try{
      const len=4*c.sampleRate, buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
      let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.015*w)/1.015; ch[i]=last*4; }
      const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      const flt=c.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=480;
      this.waveGain=c.createGain(); this.waveGain.gain.value=.05;
      src.connect(flt); flt.connect(this.waveGain); this.waveGain.connect(Sound._g.ambient); src.start();
    }catch(e){}
    setInterval(()=>this.tick(), 950);
    setInterval(()=>this.ambient(), 2600);
  },
  tick(){
    if(!Sound.ctx||!S||!S.settings.music||Sound.muted) return;
    if(Math.random()<.45) return; // паузы между нотами: мелодия «блуждает», а не льётся потоком
    let st=((Math.random()*5)|0)-2;
    if(this.step<4&&st<0) st=-st; if(this.step>this.scale.length-4&&st>0) st=-st;
    this.step=clamp(this.step+st,0,this.scale.length-1);
    const f=this.scale[this.step], t=Sound._now()+.05, bus=Sound._g.music;
    Sound.toneAt(f,t,1.7,{gain:.11,attack:.25,bus:bus,detune:Math.random()<.3});
    if(Math.random()<.22) Sound.toneAt(this.scale[(Math.random()*2)|0]/2,t+.1,2.6,{gain:.06,attack:.4,bus:bus});
    if(Math.random()<.18&&this.step+2<this.scale.length) Sound.toneAt(this.scale[this.step+2],t+.3,1.3,{gain:.05,attack:.3,bus:bus});
  },
  ambient(){
    if(!Sound.ctx||Sound.muted) return;
    if(this.waveGain) this.waveGain.gain.setTargetAtTime(.04+Math.random()*.03, Sound.ctx.currentTime, 1.6);
    const r=Math.random(), t=Sound._now()+.02;
    if(r<.34){ Sound.swell(t, 1.8+Math.random()*1.4, {gain:.1, ff:700}); } // волна прибоя
    else if(r<.52){ const b=900+((Math.random()*3)|0)*100; Sound.toneAt(b,t,.3,{gain:.05,glide:b*.6,bus:Sound._g.ambient}); } // чайка
    else if(r<.72){ if(nightF<0.4) Sound.play('birdChirp'); } // птицы днём
    else if(r<.88){ Sound.noiseHit(t,.4,{ff:3500,q:.5,gain:.07,bus:Sound._g.ambient}); } // шелест листвы
  }
};

cv.addEventListener('pointerdown', e=>{
  Sound.ensure(); cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, [e.clientX, e.clientY]);
  if(pointers.size===2){ const p=[...pointers.values()]; pinchD=Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]); dragging=true; dragMoved=99; }
  else { lastPX=e.clientX; lastPY=e.clientY; dragMoved=0; downT=performance.now(); }

cv.addEventListener('pointermove', e=>{

  const ci=clamp((wy/T)|0,0,H-1)*W+clamp((wx/T)|0,0,W-1); hoverIdx=ci;
  if(!pointers.has(e.pointerId)) return;

  if(pointers.size===2){ const p=[...pointers.values()]; const d=Math.hypot(p[0][0]-p[1][0], p[0][1]-p[1][1]);
    if(pinchD>0){ const mx=(p[0][0]+p[1][0])/2, my=(p[0][1]+p[1][1])/2; zoomAt(mx,my, S.cam.z*(d/pinchD)); }
    pinchD=d; return; }
  const dx=e.clientX-lastPX, dy=e.clientY-lastPY; lastPX=e.clientX; lastPY=e.clientY;
  dragMoved+=Math.abs(dx)+Math.abs(dy);
  if(dragMoved>8){ dragging=true; cv.classList.add('drag');
    S.cam.x-=dx/S.cam.z; S.cam.y-=dy/S.cam.z; camVX=-dx/S.cam.z*7; camVY=-dy/S.cam.z*7; clampCam(); }
});
function endPointer(e){
  pointers.delete(e.pointerId);
  if(pointers.size<2) pinchD=0;
  if(pointers.size>0) return;
  cv.classList.remove('drag');
  if(dragging){ dragging=false; saveSoon(); return; }
  // это тап/клик
  const now=performance.now();
  if(now-lastTapT<320 && Math.hypot(e.clientX-lastTapX, e.clientY-lastTapY)<42){ // двойной тап — приблизить
    zoomAt(e.clientX, e.clientY, Math.min(1.6, S.cam.z*1.35)); lastTapT=0; return; }
  lastTapT=now; lastTapX=e.clientX; lastTapY=e.clientY;
  handleTap(e.clientX, e.clientY);
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', e=>{ pointers.delete(e.pointerId); dragging=false; cv.classList.remove('drag'); });
cv.addEventListener('contextmenu', e=>{ e.preventDefault(); if(tool){ selectTool(null); } });
function zoomAt(sx,sy,nz){
  const [bx,by]=screenToWorld(sx,sy);
  S.cam.z=clamp(nz,.7,1.6);
  const [ax,ay]=screenToWorld(sx,sy);
  S.cam.x+=bx-ax; S.cam.y+=by-ay; clampCam(); saveSoon();
}
cv.addEventListener('wheel', e=>{ e.preventDefault(); zoomAt(e.clientX, e.clientY, S.cam.z*Math.exp(-e.deltaY*.0012)); }, {passive:false});
function handleTap(sx,sy){
  Sound.ensure(); if(S.settings.music) Music.start();
  const [wx,wy]=screenToWorld(sx,sy);
  const cx=(wx/T)|0, cy=(wy/T)|0; if(cx<0||cy<0||cx>=W||cy>=H) return;
  const i=cy*W+cx; const c=S.cells[i];
  if(moveFrom>=0){ tryMove(i); return; }
  if(tool){ const ok=tryBuild(tool, i);
    if(ok){ selectTool(null); closeBuildPanel(); } // успех: панель закрыта, выбор сброшен
    else refreshCards(); // неудача: панель и выбор остаются как были, причина уже в тосте
    return; }
  if($('buildpanel').classList.contains('open')) closeBuildPanel(); // клик по миру закрывает открытую панель
  if(c.b&&c.b.type==='market'){ selectCell(i); showMarket(); return; }
  if(c.b&&isProducer(c.b.type)&&c.b.ready&&!c.b.damaged){ collectBuilding(i); selectCell(i); return; }
  if(c.n&&c.nh>0){ hitNode(i); selectCell(i); return; }
  Sound.click(); selectCell(i);
}
/* миникарта */
(function(){
  const mc=$('minimap'); let mdown=false;
  const go=e=>{ const r=mc.getBoundingClientRect(); const fx=(e.clientX-r.left)/r.width, fy=(e.clientY-r.top)/r.height;
    S.cam.x=clamp(fx*WORLD_W,0,WORLD_W); S.cam.y=clamp(fy*WORLD_H,0,WORLD_H); camVX=camVY=0; };
  mc.addEventListener('pointerdown', e=>{ mdown=true; mc.setPointerCapture(e.pointerId); go(e); });
  mc.addEventListener('pointermove', e=>{ if(mdown) go(e); });
  mc.addEventListener('pointerup', ()=>{ mdown=false; saveSoon(); });
})();
/* клавиатура */
const keysDown={};
window.addEventListener('keydown', e=>{
  if($('modalwrap').classList.contains('open')){ if(e.key==='Escape') closeModal(); return; }
  keysDown[e.key.toLowerCase()]=true;
  const step=64/S.cam.z;
  if(e.key==='ArrowLeft'||e.key.toLowerCase()==='a') { S.cam.x-=step; camVX=0; }
  else if(e.key==='ArrowRight'||e.key.toLowerCase()==='d') { S.cam.x+=step; camVX=0; }
  else if(e.key==='ArrowUp'||e.key.toLowerCase()==='w') { S.cam.y-=step; camVY=0; }
  else if(e.key==='ArrowDown'||e.key.toLowerCase()==='s') { S.cam.y+=step; camVY=0; }
  else if(e.key.toLowerCase()==='f') toggleFS();
  else if(e.key==='Escape'){ if(moveFrom>=0){ moveFrom=-1; toast('Переезд отменён.'); } else if(tool) selectTool(null); else { selIdx=-1; $('selcard').classList.remove('open'); document.querySelectorAll('.sidepanel').forEach(x=>x.classList.remove('open')); $('buildpanel').classList.remove('open'); } }
  else if(/^[1-8]$/.test(e.key)){ const t=BUILD_ORDER[+e.key-1]; if(t) selectTool(tool===t?null:t); }
  else return;
  clampCam(); saveSoon(); if(e.key.startsWith('Arrow')) e.preventDefault();
});
window.addEventListener('keyup', e=>{ keysDown[e.key.toLowerCase()]=false; });

/* ============================================================
   СТАРТ
   ============================================================ */
const loadedSave=load();
S=loadedSave||newState((Math.random()*1e9)|0);
if(S.seasonOverride==null&&typeof S.savedSeason==='number'&&S.savedSeason!==seasonIdx()) S.seasonOverride=S.savedSeason; // сезон из сейва восстанавливается точно
Sound.muted=!!S.settings.mute;
curSeason=seasonIdx(); S.lastSeason=curSeason; S.happy=happinessCalc(S).value;
buildTerrain(); buildCards(); initCritters(); ensureDaily(); updateResBar(); renderQuests(); renderAchs(); renderChron(); updateSoundIcon(); updateMusicIcon(); updateSeasonIcon(); applyHud(); syncAgents(); checkQuests(); checkAchs();
if(S.stats.peakPop<popCapacity(S)) S.stats.peakPop=popCapacity(S);
requestAnimationFrame(loop);
if(migratedFromOld){ setTimeout(()=>{ toast('Обновление «Живой остров»: сейв перенесён без потерь! Новые ресурсы, постройки, сезоны и летопись уже в игре.', 'gold'); addChron('Остров обновился до версии «Живой остров» — всё построенное сохранилось.'); save(); }, 400); }
else if(!loadedSave){ setTimeout(()=>{ showHelp(); toast('Добро пожаловать в Tiny Worlds!'); addChron('Основан новый остров.'); }, 350); }
else setTimeout(()=>toast('С возвращением! Остров ждал вас.'), 350);
</script>

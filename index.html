<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<meta name="color-scheme" content="light" />
<link rel="icon" href="data:," />
<title>Tiny Worlds — уютный остров</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Rubik:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>
/* Telegram Mini App: лёгкая интеграция. Вне Telegram (обычный браузер)
   блок не срабатывает — игра полностью автономна. */
(function(){
  if (window.Telegram && Telegram.WebApp) {
    var wa = Telegram.WebApp;
    try { wa.ready(); } catch (e) {}
    try { wa.expand(); } catch (e) {}
    try { if (typeof wa.disableVerticalSwipes === 'function') wa.disableVerticalSwipes(); } catch (e) {}
    try { if (typeof wa.setHeaderColor === 'function') wa.setHeaderColor('#1e4256'); } catch (e) {}
    try { if (typeof wa.setBackgroundColor === 'function') wa.setBackgroundColor('#1e4256'); } catch (e) {}
  }
})();
</script>
<style>
  :root{
    --parch:#f4e7c8; --parch2:#ecd9ac; --ink:#4a3620; --ink2:#6d5133;
    --edge:#a97f45; --edge2:#8a6535; --accent:#b3543f; --good:#5d8a48; --bad:#b03a2e;
    --shadow:0 6px 18px rgba(46,30,8,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;height:100%;overflow:hidden;background:#79b5c9;font-family:'Rubik',system-ui,sans-serif;color:var(--ink);}
  #game{position:fixed;inset:0;display:block;touch-action:none;cursor:grab;}
  #game.drag{cursor:grabbing;}
  .parch{
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,250,230,.7), transparent 55%),
      radial-gradient(ellipse at 85% 90%, rgba(190,150,90,.35), transparent 55%),
      linear-gradient(160deg, var(--parch) 0%, var(--parch2) 100%);
    border:2px solid var(--edge);
    border-radius:14px 18px 12px 20px / 18px 12px 20px 14px;
    box-shadow:var(--shadow), inset 0 0 0 3px rgba(255,246,220,.45), inset 0 0 22px rgba(160,115,55,.25);
  }
  /* ---------- top resources: компактные полупрозрачные чипы ---------- */
  #reshud{
    position:fixed;top:10px;left:66px;z-index:20;display:flex;gap:6px;align-items:flex-start;
    max-width:min(660px,calc(100vw - 90px));
  }
  #resbar{display:flex;gap:5px;flex-wrap:wrap;align-items:center;}
  .res{display:flex;align-items:center;gap:5px;font-weight:700;font-size:14.5px;padding:3px 9px;border-radius:10px;
    background:linear-gradient(160deg, rgba(246,233,203,.90), rgba(236,217,172,.84));
    border:1.5px solid rgba(169,127,69,.75);box-shadow:0 3px 9px rgba(46,30,8,.28), inset 0 0 0 2px rgba(255,246,220,.35);white-space:nowrap;}
  .res svg{width:18px;height:18px;flex:none;}
  .res small{font-weight:500;color:var(--ink2);font-size:11px;}
  .res.full{color:var(--bad);}
  .rbtn.mini{width:30px;height:30px;flex:none;margin-top:1px;}
  .rbtn.mini svg{width:16px;height:16px;}
  #res-chest{position:fixed;top:10px;left:66px;z-index:21;}
  /* ---------- round buttons ---------- */
  #roundbtns{position:fixed;top:10px;left:10px;display:flex;flex-direction:column;gap:8px;z-index:21;}
  .rbtn{
    width:46px;height:46px;border-radius:50%;border:2px solid var(--edge);cursor:pointer;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 35% 30%, #fbf0d2, var(--parch2));
    box-shadow:var(--shadow), inset 0 0 0 2px rgba(255,246,220,.5);
    color:var(--ink);padding:0;
  }
  .rbtn:hover{filter:brightness(1.06);}
  .rbtn:active{transform:scale(.94);}
  .rbtn svg{width:23px;height:23px;}
  /* ---------- minimap ---------- */
  #mapwrap{position:fixed;left:10px;bottom:10px;z-index:20;padding:7px;text-align:center;}
  #mapwrap .cap{font-family:'Caveat',cursive;font-size:16px;font-weight:700;letter-spacing:.12em;color:var(--ink2);line-height:1;margin-bottom:4px;}
  #minimap{display:block;border-radius:6px;border:1px solid rgba(138,101,53,.6);cursor:pointer;touch-action:none;}
  /* ---------- bottom-right action buttons ---------- */
  #actions{position:fixed;right:10px;bottom:10px;z-index:21;display:flex;flex-direction:column;gap:8px;align-items:flex-end;}
  .abtn{
    display:flex;align-items:center;gap:8px;cursor:pointer;border:2px solid var(--edge);
    font-family:'Caveat',cursive;font-size:21px;font-weight:700;color:var(--ink);
    padding:7px 16px 9px;border-radius:14px 18px 12px 20px / 18px 12px 20px 14px;
    background:radial-gradient(ellipse at 25% 15%, rgba(255,250,230,.75), transparent 60%), linear-gradient(160deg, var(--parch), var(--parch2));
    box-shadow:var(--shadow), inset 0 0 0 3px rgba(255,246,220,.45);
  }
  .abtn:hover{filter:brightness(1.05);}
  .abtn:active{transform:scale(.97);}
  .abtn svg{width:21px;height:21px;}
  .abtn .dot{min-width:20px;height:20px;border-radius:50%;background:var(--accent);color:#ffeeda;font-family:'Rubik';font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px;}
  /* ---------- build panel ---------- */
  #buildpanel{
    position:fixed;left:50%;bottom:10px;transform:translate(-50%,130%);z-index:22;
    padding:10px 12px 12px;max-width:min(96vw,860px);transition:transform .28s ease;
  }
  #buildpanel.open{transform:translate(-50%,0);}
  #buildpanel h3{margin:0 0 8px;font-family:'Caveat',cursive;font-size:22px;text-align:center;}
  #buildclose{
    position:absolute;top:5px;right:9px;width:30px;height:30px;border-radius:50%;cursor:pointer;
    border:2px solid var(--edge2);background:radial-gradient(circle at 35% 30%, #fbf0d2, var(--parch2));
    color:var(--ink);font-size:15px;font-weight:700;line-height:1;padding:0;box-shadow:0 3px 8px rgba(46,30,8,.3);
  }
  #buildclose:hover{filter:brightness(1.07);}
  #buildclose:active{transform:scale(.93);}
  #buildpanel:not(.open) #buildclose{display:none;}
  #buildcards{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin;}
  .bcard{
    flex:0 0 auto;width:104px;padding:7px 6px 8px;text-align:center;cursor:pointer;position:relative;
    background:rgba(255,248,225,.6);border:2px solid rgba(169,127,69,.65);border-radius:12px;
  }
  .bcard:hover{border-color:var(--edge2);}
  .bcard.sel{border-color:var(--accent);background:rgba(255,238,205,.95);box-shadow:0 0 0 2px rgba(179,84,63,.35);}
  .bcard canvas{width:56px;height:56px;display:block;margin:0 auto;}
  .bcard .nm{font-weight:700;font-size:13px;margin-top:2px;}
  .bcard .cost{font-size:11.5px;color:var(--ink2);display:flex;justify-content:center;gap:6px;margin-top:2px;flex-wrap:wrap;}
  .bcard .cost b{color:var(--ink);}
  .bcard .cost .no b{color:var(--bad);}
  .bcard .key{position:absolute;top:4px;left:6px;font-size:10px;color:var(--ink2);border:1px solid rgba(109,81,51,.5);border-radius:4px;padding:0 4px;background:rgba(255,248,225,.8);}
  .bcard .lock{font-size:11px;color:var(--bad);font-weight:700;margin-top:2px;}
  /* ---------- side scrolls (quests / achievements) ---------- */
  .sidepanel{
    position:fixed;top:64px;right:10px;width:min(320px,88vw);max-height:calc(100% - 190px);overflow-y:auto;
    z-index:22;padding:14px 16px;transform:translateX(115%);transition:transform .28s ease;scrollbar-width:thin;
  }
  .sidepanel.open{transform:translateX(0);}
  .sidepanel h3{margin:0 0 4px;font-family:'Caveat',cursive;font-size:25px;}
  .sidepanel .sub{font-size:12.5px;color:var(--ink2);margin-bottom:10px;}
  .quest{border-top:1px dashed rgba(138,101,53,.55);padding:9px 0;}
  .quest:first-of-type{border-top:none;}
  .quest .qt{font-weight:700;font-size:15px;display:flex;justify-content:space-between;gap:8px;}
  .quest .qd{font-size:13px;color:var(--ink2);margin-top:2px;}
  .quest .bar{height:8px;border-radius:5px;background:rgba(109,81,51,.25);margin-top:6px;overflow:hidden;}
  .quest .bar i{display:block;height:100%;background:linear-gradient(90deg,#7ba95c,#5d8a48);border-radius:5px;}
  .quest .rw{font-size:12.5px;margin-top:5px;color:var(--ink2);}
  .quest.done .qt{color:var(--good);}
  .quest.future{opacity:.55;}
  .ach{display:flex;gap:10px;align-items:center;border-top:1px dashed rgba(138,101,53,.55);padding:8px 0;}
  .ach:first-of-type{border-top:none;}
  .ach .medal{width:38px;height:38px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid var(--edge2);background:radial-gradient(circle at 35% 30%,#ffe9a8,#d9a94f);font-size:19px;}
  .ach.locked .medal{background:radial-gradient(circle at 35% 30%,#e6ddc8,#b8ab8d);filter:grayscale(.7);opacity:.65;}
  .ach .an{font-weight:700;font-size:14px;}
  .ach .ad{font-size:12px;color:var(--ink2);}
  /* ---------- selected object card ---------- */
  #selcard{
    position:fixed;left:50%;bottom:10px;transform:translateX(-50%);z-index:23;display:none;
    width:min(430px,94vw);padding:12px 16px;
  }
  #selcard.open{display:block;animation:selin .25s ease;}
  @keyframes selin{from{opacity:0;transform:translate(-50%,14px);}to{opacity:1;transform:translate(-50%,0);}}
  #selcard h3{margin:0;font-family:'Caveat',cursive;font-size:24px;display:flex;justify-content:space-between;align-items:center;}
  #selcard .x{cursor:pointer;border:none;background:none;font-size:19px;color:var(--ink2);padding:2px 6px;}
  #selinfo{font-size:13.5px;margin:4px 0 8px;line-height:1.45;}
  #selbtns{display:flex;gap:8px;flex-wrap:wrap;}
  .btn{
    cursor:pointer;border:2px solid var(--edge2);border-radius:10px;padding:7px 13px;
    font-family:'Rubik';font-weight:700;font-size:13.5px;color:var(--ink);
    background:linear-gradient(160deg,#fdf3d3,#ecd9ac);box-shadow:0 3px 8px rgba(46,30,8,.25);
  }
  .btn:hover{filter:brightness(1.05);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  .btn.primary{background:linear-gradient(160deg,#a8c686,#7ba95c);border-color:#5d7a3d;color:#233311;}
  .btn.danger{background:linear-gradient(160deg,#e5a08e,#cf7a5f);border-color:#9c4a33;color:#4d1d10;}
  .btn.small{padding:5px 10px;font-size:12.5px;}
  /* ---------- toasts ---------- */
  #toasts{position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:40;display:flex;flex-direction:column;gap:7px;align-items:center;pointer-events:none;width:max-content;max-width:94vw;}
  .toast{
    padding:8px 18px;font-weight:700;font-size:14.5px;text-align:center;
    animation:tin .25s ease;max-width:94vw;
  }
  .toast.err{color:var(--bad);}
  .toast.gold{color:#7a5410;}
  @keyframes tin{from{opacity:0;transform:translateY(-8px) scale(.96);}to{opacity:1;transform:none;}}
  .toast.out{opacity:0;transition:opacity .4s;}
  /* ---------- modal ---------- */
  #modalwrap{position:fixed;inset:0;z-index:50;display:none;align-items:center;justify-content:center;background:rgba(43,28,8,.45);padding:14px;}
  #modalwrap.open{display:flex;}
  #modal{width:min(460px,95vw);max-height:88vh;overflow-y:auto;padding:20px 22px;}
  #modal h2{margin:0 0 8px;font-family:'Caveat',cursive;font-size:30px;}
  #modal p{font-size:14px;line-height:1.55;margin:6px 0;}
  #modal .mbtns{display:flex;flex-direction:column;gap:8px;margin-top:14px;}
  #modal .mbtns .btn{text-align:center;padding:10px;}
  #modal table{width:100%;border-collapse:collapse;font-size:14px;margin:8px 0;}
  #modal td{padding:4px 6px;border-bottom:1px dashed rgba(138,101,53,.4);}
  #modal td:last-child{text-align:right;font-weight:700;}
  /* ---------- rotate hint ---------- */
  #rotate{
    position:fixed;left:50%;bottom:86px;transform:translateX(-50%);z-index:15;display:none;
    padding:7px 16px;font-family:'Caveat',cursive;font-size:19px;font-weight:700;pointer-events:none;white-space:nowrap;
  }
  @media (orientation:portrait) and (max-width:640px){ #rotate{display:block;} }
  /* ---------- update: Живой остров ---------- */
  body.photo #reshud, body.photo #res-chest, body.photo #roundbtns, body.photo #mapwrap, body.photo #actions,
  body.photo #buildpanel, body.photo .sidepanel, body.photo #selcard, body.photo #rotate, body.photo #toasts{ display:none !important; }
  #btn-trader{ border-color:#2e6da4; animation:pulseB 1.1s ease-in-out infinite; }
  @keyframes pulseB{ 0%,100%{ transform:scale(1);} 50%{ transform:scale(1.045);} }
  .mchip{ cursor:pointer; border:2px solid rgba(169,127,69,.6); background:rgba(255,248,225,.6); border-radius:9px;
    padding:5px 10px; font-family:'Rubik'; font-weight:700; font-size:13px; color:var(--ink); }
  .mchip.sel{ border-color:var(--accent); background:rgba(255,238,205,.95); box-shadow:0 0 0 2px rgba(179,84,63,.3); }
  .mchip:disabled{ opacity:.4; cursor:not-allowed; }
  .mrow{ display:flex; gap:6px; flex-wrap:wrap; margin:5px 0 9px; }
  .mlabel{ font-size:12.5px; font-weight:700; color:var(--ink2); margin-top:8px; }
  .chron{ border-top:1px dashed rgba(138,101,53,.55); padding:7px 0; font-size:13px; }
  .chron:first-of-type{ border-top:none; }
  .chron .ct{ font-size:11.5px; color:var(--ink2); font-weight:700; }
  .statgrid{ display:grid; grid-template-columns:1fr auto; gap:3px 12px; font-size:13.5px; margin:6px 0 10px; }
  .statgrid b{ text-align:right; }
  .offer{ border:2px solid rgba(169,127,69,.55); border-radius:10px; padding:9px 11px; margin:8px 0; background:rgba(255,248,225,.55); font-size:14px; }
  .offer .obtns{ display:flex; gap:8px; margin-top:7px; }
  @media (max-width:760px){
    #mapwrap{display:none;}
    #reshud{left:56px;max-width:calc(100vw - 64px);}
    #res-chest{left:56px;width:40px;height:40px;}
    .res{font-size:12px;padding:2px 6px;gap:4px;}
    .res svg{width:15px;height:15px;}
    .res small{display:none;}
    #roundbtns .rbtn{width:40px;height:40px;}
    .sidepanel{top:56px;}
    #toasts{top:104px;}
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="reshud">
  <div id="resbar"></div>
  <button class="rbtn mini" id="res-toggle" title="Свернуть панель ресурсов" aria-label="Свернуть ресурсы"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 14l7-7 7 7"/></svg></button>
</div>
<button class="rbtn" id="res-chest" title="Показать ресурсы" aria-label="Показать ресурсы" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 10a9 5.4 0 0118 0v8a1.6 1.6 0 01-1.6 1.6H4.6A1.6 1.6 0 013 18z"/><path d="M3 10h18"/><rect x="9.6" y="8.4" width="4.8" height="4.6" rx="1" fill="currentColor" stroke="none"/></svg></button>

<div id="roundbtns">
  <button class="rbtn" id="btn-menu" title="Меню" aria-label="Меню"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <button class="rbtn" id="btn-home" title="Камера к острову" aria-label="Камера домой"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 11l9-7 9 7"/><path d="M6 10v9h12v-9"/></svg></button>
  <button class="rbtn" id="btn-season" title="Сменить сезон" aria-label="Сменить сезон"></button>
  <button class="rbtn" id="btn-music" title="Музыка" aria-label="Музыка"></button>
  <button class="rbtn" id="btn-sound" title="Звук" aria-label="Звук"></button>
  <button class="rbtn" id="btn-photo" title="Фоторежим: снимок острова в PNG" aria-label="Фото острова"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 8h3l2-2.5h6L17 8h3v11H4z"/><circle cx="12" cy="13" r="3.4"/></svg></button>
  <button class="rbtn" id="btn-fs" title="Полный экран (F)" aria-label="Полный экран"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
</div>

<div id="mapwrap" class="parch"><div class="cap">КАРТА МИРА</div><canvas id="minimap" width="196" height="140"></canvas></div>

<div id="actions">
  <button class="abtn" id="btn-trader" style="display:none"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 15l1.5 4h15L21 15"/><path d="M12 15V5"/><path d="M12 5l5 6h-5"/></svg>Торговец!<span class="dot" id="trader-dot">60</span></button>
  <button class="abtn" id="btn-chron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M5 3h14v18H5z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4.5"/></svg>Летопись</button>
  <button class="abtn" id="btn-quests"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 3h13v18l-3-2-2 2-2-2-3 2-3-2z"/><path d="M9 8h7M9 12h7"/></svg>Задания<span class="dot" id="quest-dot" style="display:none">!</span></button>
  <button class="abtn" id="btn-ach"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="9" r="5"/><path d="M8.5 13L7 21l5-2.6L17 21l-1.5-8"/></svg>Награды</button>
  <button class="abtn" id="btn-build"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M13 3l8 8-3 3-8-8z"/><path d="M10 6L3 13l3 3 7-7"/><path d="M13 16l5 5"/></svg>Строительство</button>
</div>

<div id="buildpanel" class="parch"><button id="buildclose" aria-label="Закрыть строительство" title="Закрыть">✕</button><h3>Что построим?</h3><div id="buildcards"></div></div>

<div id="questpanel" class="sidepanel parch">
  <h3>Задания острова</h3><div class="sub">Выполняйте по порядку — за каждое положена награда.</div><div id="dailylist"></div><div id="questlist"></div>
</div>
<div id="chronpanel" class="sidepanel parch">
  <h3>Летопись острова</h3><div class="sub">Статистика поселения и журнал событий.</div><div id="chronstats"></div><div id="chronlist"></div>
</div>
<div id="achpanel" class="sidepanel parch">
  <h3>Медальоны</h3><div class="sub">Памятные награды за дела островитян. На баланс не влияют — просто приятно.</div><div id="achlist"></div>
</div>

<div id="selcard" class="parch">
  <h3><span id="selname"></span><button class="x" id="selclose" aria-label="Закрыть">✕</button></h3>
  <div id="selinfo"></div><div id="selbtns"></div>
</div>

<div id="rotate" class="parch">Поверни телефон горизонтально — так остров виднее</div>
<div id="toasts"></div>

<div id="modalwrap"><div id="modal" class="parch"></div></div>
<input type="file" id="importfile" accept="application/json,.json" style="display:none" />

<script>
'use strict';
/* ============================================================
   Tiny Worlds — своя версия. Canvas-игра в одном файле.
   Логика отделена от отрисовки: состояние S, рендер по S.
   ============================================================ */
const W=28, H=20, T=48;                 // мир 28x20, клетка 48px в мировых координатах
const WORLD_W=W*T, WORLD_H=H*T;
const SAVE_KEY='tinyworlds.save.v4', SAVE_BAK='tinyworlds.save.v4.bak', OLD_KEY='tinyworlds.save.v3', OLD_BAK='tinyworlds.save.v3.bak';
const BASE_CAP=300;
const RES_KEYS=['wood','stone','food','fish','berries','honey'];
const SEASONS=['Весна','Лето','Осень','Зима'];

/* ---------- утилиты ---------- */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
const fmt=n=>Math.floor(n).toLocaleString('ru-RU');

/* ---------- звук: процедурный аудиодвижок (WebAudio, без файлов) ----------
   Три шины (sfx / music / ambient) через master. 22 эффекта по событиям игры;
   генеративная музыка и амбиент природы — объект Music ниже. */
const Sound={
  ctx:null, muted:false, _g:null, _rain:null,
  ensure(){ if(!this.ctx){ try{ this.ctx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){}
      if(this.ctx){ const c=this.ctx;
        const master=c.createGain(); master.gain.value=.9; master.connect(c.destination);
        const bus=v=>{ const g=c.createGain(); g.gain.value=v; g.connect(master); return g; };
        this._g={master:master, sfx:bus(.85), music:bus(.4), ambient:bus(.55)};
      } }
    if(this.ctx&&this.ctx.state==='suspended') this.ctx.resume(); },
  _now(){ return this.ctx? this.ctx.currentTime:0; },
  /* тон: мягкая атака, экспоненциальный спад, глиссандо, расстроенная 2-я гармоника */
  toneAt(f,t0,d,o){ if(!this.ctx) return; o=o||{}; const c=this.ctx, dest=o.bus||this._g.sfx;
    const osc=c.createOscillator(), g=c.createGain(); osc.type=o.type||'sine';
    osc.frequency.setValueAtTime(f,t0); if(o.glide) osc.frequency.exponentialRampToValueAtTime(Math.max(20,o.glide),t0+d*.8);
    g.gain.setValueAtTime(.0001,t0); g.gain.exponentialRampToValueAtTime(o.gain||.15,t0+(o.attack||.015)); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    osc.connect(g); g.connect(dest); osc.start(t0); osc.stop(t0+d+.05);
    if(o.detune){ const o2=c.createOscillator(), g2=c.createGain(); o2.type=o.type||'sine'; o2.frequency.setValueAtTime(f*1.004,t0);
      g2.gain.setValueAtTime(.0001,t0); g2.gain.exponentialRampToValueAtTime((o.gain||.15)*.6,t0+(o.attack||.015)); g2.gain.exponentialRampToValueAtTime(.0001,t0+d);
      o2.connect(g2); g2.connect(dest); o2.start(t0); o2.stop(t0+d+.05); } },
  tone(f,d,type,g,when,slide){ if(this.muted||!this.ctx) return; this.toneAt(f, this._now()+(when||0), d, {type:type, gain:g, glide:slide}); },
  /* шумовой удар через полосовой фильтр: рубка, стук, хлопки, гром */
  noiseHit(t0,d,o){ if(!this.ctx) return; o=o||{}; const c=this.ctx;
    const len=Math.max(1,(c.sampleRate*d)|0), buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
    for(let i=0;i<len;i++){ const dec=1-i/len; ch[i]=(Math.random()*2-1)*dec*dec; }
    const src=c.createBufferSource(); src.buffer=buf;
    const flt=c.createBiquadFilter(); flt.type=o.ft||'bandpass'; flt.frequency.value=o.ff||1200; flt.Q.value=o.q||1.1;
    const g=c.createGain(); g.gain.setValueAtTime(o.gain||.4,t0); g.gain.exponentialRampToValueAtTime(.0001,t0+d);
    src.connect(flt); flt.connect(g); g.connect(o.bus||this._g.sfx); src.start(t0); src.stop(t0+d+.02);
    if(o.click) this.toneAt(o.click, t0, .05, {type:'square', gain:o.clickGain||.1}); },
  /* мягкая шумовая волна на ambient-шину: прибой, ветер */
  swell(t0,d,o){ if(!this.ctx) return; o=o||{}; const c=this.ctx;
    const len=Math.max(1,(c.sampleRate*d)|0), buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
    let last=0; for(let i=0;i<len;i++){ const w=Math.random()*2-1; last=(last+.02*w)/1.02; ch[i]=last*3.2; }
    const src=c.createBufferSource(); src.buffer=buf;
    const flt=c.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value=o.ff||800;
    const g=c.createGain(), peak=o.gain||.12; g.gain.setValueAtTime(.0001,t0); g.gain.linearRampToValueAtTime(peak,t0+d*.35); g.gain.linearRampToValueAtTime(.0001,t0+d);
    src.connect(flt); flt.connect(g); g.connect(this._g.ambient); src.start(t0); src.stop(t0+d+.05); },
  /* ---- звуковые эффекты по событиям игры ---- */
  sfx:{
    click(){ Sound.toneAt(740,Sound._now(),.08,{type:'triangle',gain:.12,attack:.005}); },
    uiOpen(){ const t=Sound._now(); Sound.toneAt(440,t,.12,{gain:.14,glide:660}); },
    uiClose(){ const t=Sound._now(); Sound.toneAt(660,t,.12,{gain:.12,glide:380}); },
    chop(){ const t=Sound._now(); Sound.noiseHit(t,.1,{ff:900+Math.random()*200,q:2.2,gain:.45,click:140,clickGain:.1}); },
    mine(){ const t=Sound._now(); Sound.noiseHit(t,.09,{ff:2100,q:2.6,gain:.4,click:320,clickGain:.08}); },
    gatherBerry(){ const t=Sound._now(); Sound.toneAt(880,t,.15,{gain:.16,detune:1}); },
    depleteNode(){ const t=Sound._now(); Sound.noiseHit(t,.18,{ff:500,q:1.5,gain:.3}); Sound.toneAt(220,t+.02,.2,{gain:.08}); },
    build(){ const t=Sound._now(); Sound.noiseHit(t,.08,{ff:1500,gain:.3,click:200}); Sound.toneAt(392,t+.04,.18,{type:'triangle',gain:.14}); Sound.toneAt(523,t+.12,.22,{type:'triangle',gain:.12}); },
    demolish(){ const t=Sound._now(); Sound.noiseHit(t,.3,{ff:400,q:.8,gain:.4}); Sound.toneAt(165,t+.05,.3,{type:'sawtooth',gain:.1,glide:90}); },
    upgrade(){ const t=Sound._now(); [523,659,784].forEach((f,i)=>Sound.toneAt(f,t+i*.09,.22,{type:'triangle',gain:.14})); },
    collect(){ const t=Sound._now(); Sound.toneAt(784,t,.1,{gain:.14}); Sound.toneAt(988,t+.06,.14,{gain:.12}); },
    coin(){ const t=Sound._now(); Sound.toneAt(1046,t,.08,{type:'square',gain:.13}); Sound.toneAt(1318,t+.05,.12,{type:'square',gain:.1}); },
    questComplete(){ const t=Sound._now(); [523,659,784,1046].forEach((f,i)=>Sound.toneAt(f,t+i*.1,.3,{type:'triangle',gain:.16,detune:1})); },
    levelUp(){ const t=Sound._now(); [392,523,659,784,1046].forEach((f,i)=>Sound.toneAt(f,t+i*.08,.35,{type:'triangle',gain:.18,detune:1})); },
    error(){ const t=Sound._now(); Sound.toneAt(220,t,.18,{type:'square',gain:.13,glide:140}); },
    notify(){ const t=Sound._now(); Sound.toneAt(740,t,.1,{gain:.12}); },
    thunder(){ const t=Sound._now(); Sound.noiseHit(t,.6,{ff:220,q:.6,gain:.5}); Sound.noiseHit(t+.15,.4,{ff:160,q:.5,gain:.35}); },
    splash(){ const t=Sound._now(); Sound.noiseHit(t,.22,{ff:1800,q:1.8,gain:.22}); },
    birdChirp(){ const t=Sound._now(), b=1400+((Math.random()*4)|0)*200; Sound.toneAt(b,t,.08,{gain:.06,glide:b*1.3,bus:Sound._g.ambient}); Sound.toneAt(b*1.2,t+.09,.06,{gain:.05,glide:b*.9,bus:Sound._g.ambient}); },
    confettiPop(){ const t=Sound._now(); Sound.noiseHit(t,.06,{ff:3000,gain:.18}); },
    shipHorn(){ const t=Sound._now(); Sound.toneAt(196,t,.5,{type:'sawtooth',gain:.15}); Sound.toneAt(147,t+.05,.6,{type:'sawtooth',gain:.11}); },
    settlerSpawn(){ const t=Sound._now(); Sound.toneAt(523,t,.1,{gain:.12}); Sound.toneAt(659,t+.08,.14,{gain:.1}); }
  },
  play(name){ if(this.muted||!this.ctx) return; const f=this.sfx[name]; if(f) f(); },
  /* совместимые обёртки для существующего кода */
  click(){ this.play('click'); },
  hit(){ this.play('mine'); },
  chop(){ this.play('chop'); },
  build(){ this.play('build'); },
  collect(){ this.play('collect'); },
  quest(){ this.play('questComplete'); },
  ach(){ this.play('levelUp'); },
  err(){ this.play('error'); },
  pop(){ this.play('uiClose'); },
  /* петля дождя: белый шум через highpass на ambient-шине */
  rainStart(){ if(!this.ctx||this._rain) return; const c=this.ctx;
    try{ const len=2*c.sampleRate, buf=c.createBuffer(1,len,c.sampleRate), ch=buf.getChannelData(0);
      for(let i=0;i<len;i++) ch[i]=(Math.random()*2-1)*.55;
      const src=c.createBufferSource(); src.buffer=buf; src.loop=true;
      const flt=c.createBiquadFilter(); flt.type='highpass'; flt.frequency.value=1900;
      const g=c.createGain(); g.gain.value=.0001; g.gain.setTargetAtTime(this.muted?0:.16,c.currentTime,1.1);
      src.connect(flt); flt.connect(g); g.connect(this._g.ambient); src.start(); this._rain={src:src,g:g}; }catch(e){} },
  rainStop(){ if(!this._rain) return; const r=this._rain; this._rain=null;
    try{ r.g.gain.setTargetAtTime(.0001,this.ctx.currentTime,.8); setTimeout(()=>{ try{ r.src.stop(); }catch(e){} },1800); }catch(e){} },
  rainSync(){ if(!this._rain) return; try{ this._rain.g.gain.setTargetAtTime(this.muted?0:.16,this.ctx.currentTime,.4); }catch(e){} }
};

/* ---------- производные величины ---------- */
function countB(S,type){ let n=0; for(const c of S.cells) if(c.b&&c.b.type===type) n++; return n; }
function totalBuildings(S){ let n=0; for(const c of S.cells) if(c.b) n++; return n; }
function popCapacity(S){ let n=(S&&S.bonusCap)||0; for(const c of S.cells) if(c.b&&c.b.type==='house') n+=houseCap(c.b.level); return n; }
function workersUsed(S){ return countB(S,'farm')+countB(S,'sawmill')+countB(S,'apiary'); }
function resCap(S){ return BASE_CAP + countB(S,'warehouse')*BUILDS.warehouse.capBonus; }
/* Клетки, достижимые от главного острова: суша и цепочки мостов по соседним клеткам.
   Разорванная цепочка или мост к другому островку соединение не создаёт. */
function reachableCells(S){
  const seen=new Set(), q=[];
  if(!S||!Array.isArray(S.cells)) return seen;
  S.cells.forEach((c,i)=>{ if(c&&c.isl===0){ seen.add(i); q.push(i); } });
  for(let qi=0; qi<q.length; qi++){
    const cur=q[qi], cx=cur%W, cy=(cur/W)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=cx+dx, ny=cy+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue;
      const ni=ny*W+nx; if(seen.has(ni)) continue;
      const nc=S.cells[ni]; if(!nc) continue;
      const passable=nc.t!=='water' || (nc.b&&nc.b.type==='bridge');
      if(!passable) continue;
      seen.add(ni); q.push(ni);
    }
  }
  return seen;
}
function connectedIslands(S){
  const ids=new Set([0]);
  if(!S||!Array.isArray(S.cells)) return ids;
  for(const i of reachableCells(S)){ const isl=S.cells[i]&&S.cells[i].isl; if(isl>0) ids.add(isl); }
  return ids;
}
function isIslandConnected(S, isl){ return !isl || isl<=0 || connectedIslands(S).has(isl); }
/* штраф островков: только производство на конкретном НЕсоединённом островке — циклы дольше в 1.5 раза */
function cycleMult(S, cell){
  if(!cell || cell.isl<=0 || !cell.b || !isProducer(cell.b.type)) return 1;
  return isIslandConnected(S, cell.isl) ? 1 : 1.5;
}
/* счастье поселенцев 0..100 и список причин */
function happinessCalc(S){
  let h=50; const why=[];
  const dec=Math.min(20, countB(S,'dectree')*3); if(dec>0){ h+=dec; why.push('+'+dec+' за декоративные деревья'); }
  const lan=Math.min(15, countB(S,'lantern')*3); if(lan>0){ h+=lan; why.push('+'+lan+' за фонари'); }
  const gar=Math.min(12, countB(S,'garden')*4); if(gar>0){ h+=gar; why.push('+'+gar+' за сады'); }
  if(countB(S,'well')>0){ h+=5; why.push('+5 за колодец'); }
  let variety=0; for(const r of ['food','fish','honey']) if(S.res[r]>0) variety++;
  if(variety>0){ const v=variety*8; h+=v; why.push('+'+v+' за разнообразие еды ('+variety+' из 3)'); }
  const cap=popCapacity(S);
  if(cap>0 && totalBuildings(S)>cap*2+4){ h-=15; why.push('−15 теснота: построек много, а домов мало'); }
  if(S.res.food<=0 && S.res.fish<=0){ h-=15; why.push('−15 нечего есть: нет ни еды, ни рыбы'); }
  return {value:clamp(Math.round(h),0,100), why};
}
/* множитель скорости производства от счастья: 0.8 .. 1.3 */
function happyMult(S){ return 0.8 + (S.happy||50)/100*0.5; }
function settlementLevel(S){
  let lvl=0;
  for(let i=0;i<TOWN_LEVELS.length;i++){ const t=TOWN_LEVELS[i]; if(popCapacity(S)>=t.pop && totalBuildings(S)>=t.builds) lvl=i; }
  return lvl;
}

/* ---------- генерация мира ---------- */
function genWorld(seed){
  const rnd=mulberry32(seed);
  const ph=[rnd()*6.28, rnd()*6.28, rnd()*6.28, rnd()*6.28];
  const noise=(x,y)=> Math.sin(x*.55+ph[0])*Math.cos(y*.5+ph[1])*.6 + Math.sin((x+y)*.23+ph[2])*.5 + Math.sin(x*.13-ph[3])*Math.cos(y*.17+ph[0])*.4;
  const islands=[
    {cx:13.2, cy:9.6,  rx:8.4, ry:6.1, id:0},
    {cx:24.2, cy:3.6,  rx:2.7, ry:2.3, id:1},   // Каменный островок
    {cx:3.4,  cy:16.2, rx:2.9, ry:2.4, id:2}    // Роща
  ];
  const cells=[];
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    let best=-9, bid=-1;
    for(const isl of islands){
      const dx=(x-isl.cx)/isl.rx, dy=(y-isl.cy)/isl.ry;
      const v=1-(dx*dx+dy*dy)+noise(x,y)*.30;
      if(v>best){ best=v; bid=isl.id; }
    }
    let t='water', isl=-1;
    if(best>0.16){ isl=bid; t= best<0.42 ? 'sand':'grass'; }
    cells.push({t, isl, n:null, nh:0, nr:0, b:null, v:(rnd()*997)|0});
  }
  // песок = суша у воды; трава в глубине
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c=cells[y*W+x]; if(c.t==='water') continue;
    let shore=false;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]) { const nx=x+dx, ny=y+dy; if(nx<0||ny<0||nx>=W||ny>=H||cells[ny*W+nx].t==='water') shore=true; }
    c.t = shore ? 'sand' : 'grass';
  }
  // природные объекты: деревья и камни
  for(let i=0;i<cells.length;i++){
    const c=cells[i]; if(c.t==='water') continue;
    const r=rnd();
    if(c.isl===1){ if(r<.34){ c.n='rock'; } else if(r<.42 && c.t==='grass'){ c.n='tree'; } }
    else if(c.isl===2){ if(r<.38 && c.t==='grass'){ c.n='tree'; } else if(r<.43){ c.n='rock'; } }
    else { if(r<.18 && c.t==='grass'){ c.n='tree'; } else if(r<.235){ c.n='rock'; } }
    if(c.n) c.nh=3;
    else if(c.t==='grass'){ const rb=rnd(); const bp= c.isl===2? .10 : .045; if(rb<bp){ c.n='bush'; c.nh=1; } }
  }
  return cells;
}

let S=null;
function validateState(o){
  if(!o||typeof o!=='object') return false;
  if(!Array.isArray(o.cells)||o.cells.length!==W*H) return false;
  if(!o.res||typeof o.res.wood!=='number'||typeof o.res.stone!=='number'||typeof o.res.food!=='number') return false;
  if(!o.cam||typeof o.cam.x!=='number') return false;
  if(!o.stats||typeof o.stats.gotWood!=='number') return false;
  return true;
}
/* Миграция любого старого сейва (v3 и старше) к v4: постройки, ресурсы и прогресс сохраняются,
   новые системы получают значения по умолчанию; на пустые травяные клетки добавляются кусты ягод. */
function migrateState(o){
  const st=Object.assign(defaultStats(), o.stats||{});
  o.stats=st;
  for(const k of RES_KEYS) if(typeof o.res[k]!=='number') o.res[k]=0;
  o.settings=Object.assign({mute:false, music:false, hudCollapsed:false}, o.settings||{});
  if(typeof o.dayPhase!=='number') o.dayPhase=0.3;
  if(typeof o.gameDay!=='number') o.gameDay=1;
  if(o.seasonOverride===undefined) o.seasonOverride=null;
  if(typeof o.lastSeason!=='number') o.lastSeason=-1;
  o.seenWinter=!!o.seenWinter;
  o.bonusCap=o.bonusCap||0;
  o.festival=o.festival||0;
  o.nextEvent=(typeof o.nextEvent==='number')? o.nextEvent : 210;
  o.traderT=(typeof o.traderT==='number')? o.traderT : 280;
  o.trader=null;
  if(o.daily===undefined) o.daily=null;
  if(!Array.isArray(o.chronicle)) o.chronicle=[];
  // кусты ягод на пустых клетках травы (детерминированно от seed мира)
  const rnd=mulberry32((o.seed||1)^0xB051);
  for(const c of o.cells){ if(c.t==='grass'&&!c.n&&!c.b&&rnd()<.05){ c.n='bush'; c.nh=1; c.nr=0; } }
  o.happy=happinessCalc(o).value;
  o.level=settlementLevel(o);
  o.ver=4;
  return o;
}

  }catch(e){}
}

/* Починка сейва по полям (подход внешней версии): сейв не сбрасывается целиком
   из-за одного битого поля — каждое значение проверяется и чинится отдельно. */
function isNum(v){ return typeof v==='number'&&isFinite(v); }
function repairState(o){
  if(!o||typeof o!=='object'||!Array.isArray(o.cells)||o.cells.length!==W*H) return null;
  if(!o.res||typeof o.res!=='object') o.res={};
  for(const k of RES_KEYS) o.res[k]= isNum(o.res[k])? clamp(o.res[k],0,1e7):0;
  const TT=['water','sand','grass'], NN=['tree','rock','bush'];
  o.cells=o.cells.map(c=>{
    if(!c||typeof c!=='object') return {t:'water', isl:-1, n:null, nh:0, nr:0, b:null, v:0};
    if(TT.indexOf(c.t)<0) c.t='water';
    c.isl= isNum(c.isl)? clamp(Math.round(c.isl),-1,2):-1;
    if(c.n&&NN.indexOf(c.n)<0) c.n=null;
    c.nh= isNum(c.nh)? clamp(Math.round(c.nh),0,3):(c.n?3:0);
    c.nr= isNum(c.nr)? clamp(c.nr,0,999):0;
    if(c.b){ if(!BUILDS[c.b.type]) c.b=null;
      else { c.b.level=clamp(Math.round(isNum(c.b.level)?c.b.level:1),1,3); c.b.prog=isNum(c.b.prog)?Math.max(0,c.b.prog):0; c.b.ready=!!c.b.ready; c.b.damaged=!!c.b.damaged; c.b.pt=isNum(c.b.pt)?c.b.pt:0; } }
    if(!isNum(c.v)) c.v=0;
    return c;
  });
  if(!o.cam||!isNum(o.cam.x)||!isNum(o.cam.y)) o.cam={x:WORLD_W/2, y:WORLD_H/2, z:1};
  o.cam.z=clamp(isNum(o.cam.z)?o.cam.z:1,.7,1.6);
  o.stats=Object.assign(defaultStats(), o.stats||{});
  for(const k in o.stats) if(typeof o.stats[k]==='number'&&!isFinite(o.stats[k])) o.stats[k]=0;
  o.settings=Object.assign({mute:false, music:false, hudCollapsed:false}, o.settings||{});
  o.ach=Array.isArray(o.ach)? o.ach.filter(a=>typeof a==='string'):[];
  o.chronicle=Array.isArray(o.chronicle)? o.chronicle.filter(e=>e&&typeof e.txt==='string'):[];
  o.quest=clamp(Math.round(isNum(o.quest)?o.quest:0),0,QUESTS.length);
  o.gameDay=Math.max(1, Math.round(isNum(o.gameDay)?o.gameDay:1));
  o.dayPhase=isNum(o.dayPhase)? ((o.dayPhase%1)+1)%1 : .3;
  if(!(o.seasonOverride===null||(isNum(o.seasonOverride)&&o.seasonOverride>=0&&o.seasonOverride<=3))) o.seasonOverride=null;
  if(o.daily&&(!o.daily.date||!Array.isArray(o.daily.list))) o.daily=null;
  o.festival=isNum(o.festival)? Math.max(0,o.festival):0;
  o.nextEvent=isNum(o.nextEvent)? o.nextEvent:210;
  o.traderT=isNum(o.traderT)? o.traderT:280;
  o.trader=null;
  o.bonusCap=isNum(o.bonusCap)? Math.max(0,o.bonusCap):0;
  o.seenWinter=!!o.seenWinter;
  o.happy=happinessCalc(o).value;
  o.level=settlementLevel(o);
  o.ver=4;
  return o;
}
let migratedFromOld=false;
function load(){
  for(const k of [SAVE_KEY, SAVE_BAK]){ // текущий v4: основной, при повреждении — резервная копия
    try{ const raw=localStorage.getItem(k); if(!raw) continue; const o=JSON.parse(raw); const r=repairState(o);
      if(r){ if(k===SAVE_BAK) setTimeout(()=>toast('Основной сейв был повреждён — остров восстановлен из резервной копии.','gold'), 700); return migrateState(r); } }catch(e){}
  }
  for(const k of [OLD_KEY, OLD_BAK]){ // старый v3 — мигрируем, оригинал остаётся резервной копией
    try{ const raw=localStorage.getItem(k); if(!raw) continue; const o=JSON.parse(raw); const r=repairState(o); if(r){ migratedFromOld=true; try{ localStorage.setItem('tinyworlds.save.v3.orig', raw); }catch(e){} return migrateState(r); } }catch(e){}
  }
  return null;
}

/* ---------- рынок: ценности и плавающий курс ---------- */
const RES_VALUE={wood:1, stone:1.6, food:1.3, fish:2.2, berries:2.6, honey:5};
const RES_PHASE={wood:0, stone:2.1, food:4.2, fish:1.2, berries:3.3, honey:5.1};
function rateFactor(res){ return 1+0.22*Math.sin(worldTime*0.045+RES_PHASE[res]); }
function marketReceive(giveRes, amt, getRes){
  if(giveRes===getRes||amt<=0) return 0;
  return Math.floor(amt * (RES_VALUE[giveRes]*rateFactor(giveRes)) / (RES_VALUE[getRes]*rateFactor(getRes)));
}
function doTrade(giveRes, amt, getRes){ // рынок: обмен по текущему курсу
  amt=Math.floor(amt);
  if(amt<=0||S.res[giveRes]<amt) return -1;
  const recv=marketReceive(giveRes, amt, getRes);
  if(recv<=0) return -2;
  const room=resCap(S)-S.res[getRes];
  if(room<=0) return -3;
  const real=Math.min(recv, room);
  S.res[giveRes]-=amt; S.res[getRes]+=real;
  return real;
}
function shipReceive(giveRes, amt, getRes){ // курс торговца: на 35% выгоднее базового
  return Math.ceil(amt * RES_VALUE[giveRes]/RES_VALUE[getRes] * 1.35);
}
function genShipOffers(){
  const keys=RES_KEYS.slice(); const offers=[];
  const shuffled=keys.sort(()=>Math.random()-.5);
  for(let i=0;i<3;i++){
    const give=shuffled[i%keys.length]; let get=shuffled[(i+2)%keys.length]; if(get===give) get=shuffled[(i+3)%keys.length];
    const amt=8+((Math.random()*16)|0);
    offers.push({give, amt, get, recv:shipReceive(give, amt, get)});
  }
  return offers;
}

/* ---------- бесшовная процедурная текстура (тайлится без швов и повторов) ---------- */
function makeNoiseTile(){
  const SZ=256, LAT=8, CELL=SZ/LAT;
  const tc=document.createElement('canvas'); tc.width=SZ; tc.height=SZ;
  const tg=tc.getContext('2d');
  const rnd=mulberry32((S?S.seed:1)^0x7015E);
  const lat=[]; for(let i=0;i<=LAT;i++){ lat.push([]); for(let j=0;j<=LAT;j++) lat[i].push(rnd()); }
  const img=tg.createImageData(SZ,SZ);
  const sm=t=>t*t*(3-2*t);
  for(let py=0;py<SZ;py++) for(let px=0;px<SZ;px++){
    const gx=px/CELL, gy=py/CELL, ix=Math.floor(gx)%LAT, iy=Math.floor(gy)%LAT;
    const fx=sm(gx-Math.floor(gx)), fy=sm(gy-Math.floor(gy));
    const v00=lat[iy][ix], v10=lat[iy][(ix+1)%LAT], v01=lat[(iy+1)%LAT][ix], v11=lat[(iy+1)%LAT][(ix+1)%LAT];
    const v=(v00*(1-fx)+v10*fx)*(1-fy)+(v01*(1-fx)+v11*fx)*fy;
    const o=(py*SZ+px)*4, d=v-0.5;
    img.data[o]= d<0? 26:255; img.data[o+1]= d<0? 38:250; img.data[o+2]= d<0? 16:225;
    img.data[o+3]= Math.abs(d)*52;
  }
  tg.putImageData(img,0,0);
  return tc;
}
let noiseTileCache=null;

/* ---------- предрендер рельефа (вода, песок, трава одним слоем) ---------- */
function buildTerrain(){
  terrainCanvas=document.createElement('canvas'); terrainCanvas.width=WORLD_W; terrainCanvas.height=WORLD_H;
  const g=terrainCanvas.getContext('2d');
  const seaCols=[['#82c2d4','#62a9c6','#5096ba'],['#7fbcd2','#5ea7c4','#4d94b8'],['#7cb4cc','#5b9dbb','#4a8aac'],['#6f9fb8','#4f84a2','#3f7292']][curSeason];
  const wg=g.createLinearGradient(0,0,0,WORLD_H); wg.addColorStop(0,seaCols[0]); wg.addColorStop(.5,seaCols[1]); wg.addColorStop(1,seaCols[2]);
  g.fillStyle=wg; g.fillRect(0,0,WORLD_W,WORLD_H);
  // глубина: тёмные пятна воды
  const rnd=mulberry32(S.seed^0x9e37);
  g.fillStyle='rgba(38,90,120,.12)';
  for(let i=0;i<40;i++){ g.beginPath(); g.ellipse(rnd()*WORLD_W, rnd()*WORLD_H, 30+rnd()*90, 16+rnd()*40, rnd()*3, 0, 7); g.fill(); }
  /* Цельный органический остров: маски суши рисуем в низком разрешении
     кругами по клеткам и растягиваем с интерполяцией — берег становится
     плавной линией, а не ступенями клеток. */
  const LS=4, lw=WORLD_W/LS, lh=WORLD_H/LS, lc=T/LS;
  const mask=(pred, rad)=>{
    const m=document.createElement('canvas'); m.width=lw; m.height=lh; const mg=m.getContext('2d');
    mg.fillStyle='#fff';
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const c=S.cells[y*W+x]; if(!pred(c)) continue;
      mg.beginPath(); mg.arc((x+.5)*lc, (y+.5)*lc, rad, 0, 7); mg.fill();
      mg.fillRect(x*lc, y*lc, lc, lc); }
    return m;
  };
  const tint=(m, color)=>{ const t=document.createElement('canvas'); t.width=lw; t.height=lh; const tg=t.getContext('2d');
    tg.drawImage(m,0,0); tg.globalCompositeOperation='source-in'; tg.fillStyle=color; tg.fillRect(0,0,lw,lh); return t; };
  const sandM=mask(c=>c.t!=='water', lc*.78), grassM=mask(c=>c.t==='grass', lc*.74);
  g.imageSmoothingEnabled=true; g.imageSmoothingQuality='high';
  // мелководье — мягкий светлый ореол вокруг суши
  g.save(); g.globalAlpha=.55; try{ g.filter='blur(14px)'; }catch(e){}
  g.drawImage(tint(sandM,'#a8d8e4'), 0,0, WORLD_W, WORLD_H); g.restore();
  // песок и трава едиными «заливками» по маскам; палитра зависит от сезона
  const sandCol=['#ecd39a','#ecd39a','#e3c184','#e9e6da'][curSeason];
  const grassCol=['#7cc05e','#77b356','#c79a45','#dde7e4'][curSeason];
  g.drawImage(tint(sandM, sandCol), 0,0, WORLD_W, WORLD_H);
  g.drawImage(tint(grassM, grassCol), 0,0, WORLD_W, WORLD_H);
  // бесшовная шумовая текстура поверх суши и воды — поверхность живёт, повторов не видно
  if(!noiseTileCache) noiseTileCache=makeNoiseTile();
  try{ const pat=g.createPattern(noiseTileCache,'repeat'); if(pat){ g.save(); g.globalAlpha=.55; g.fillStyle=pat; g.fillRect(0,0,WORLD_W,WORLD_H); g.restore(); } }catch(e){}
  if(curSeason===3){ // зимой — ледок у берегов: светлые кромки на воде вдоль суши
    g.fillStyle='rgba(235,245,250,.5)';
    for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const c=S.cells[y*W+x]; if(c.t!=='water') continue;
      let shore=false; for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const n=cellAt(x+dx,y+dy); if(n&&n.t!=='water') shore=true; }
      if(shore){ g.beginPath(); g.ellipse((x+.5)*T,(y+.5)*T, T*.52, T*.4, (c.v%7), 0, 7); g.fill(); } }
  }
  // мягкие пятна оттенков — поверхность не «штампованная»
  for(let i=0;i<26;i++){ const px=rnd()*WORLD_W, py=rnd()*WORLD_H; const ci=clamp(((py/T)|0),0,H-1)*W+clamp(((px/T)|0),0,W-1);
    if(S.cells[ci].t==='water') continue;
    g.fillStyle= S.cells[ci].t==='grass'? (i%2?'rgba(46,110,35,.10)':'rgba(190,230,140,.10)') : 'rgba(190,150,80,.12)';
    g.beginPath(); g.ellipse(px, py, 26+rnd()*60, 16+rnd()*36, rnd()*3, 0, 7); g.fill(); }
  // детали: песчинки, травинки, цветочки
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){
    const c=S.cells[y*W+x]; if(c.t==='water') continue;
    const cx=x*T, cy=y*T, r2=mulberry32(c.v*31+7);
    if(c.t==='sand'){ g.fillStyle='rgba(160,120,60,.35)'; for(let i=0;i<4;i++){ g.fillRect(cx+6+r2()*36, cy+6+r2()*36, 2, 2); } }
    else{
      g.strokeStyle='rgba(46,96,32,.5)'; g.lineWidth=1.4;
      for(let i=0;i<5;i++){ const gx=cx+6+r2()*36, gy=cy+10+r2()*32; g.beginPath(); g.moveTo(gx,gy); g.lineTo(gx-2,gy-5-r2()*3); g.moveTo(gx,gy); g.lineTo(gx+2,gy-6-r2()*3); g.stroke(); }
      if(r2()<.3){ g.fillStyle=['#e86a92','#f2c14e','#ffffff'][((c.v>>4)%3)]; g.beginPath(); g.arc(cx+12+r2()*24, cy+12+r2()*24, 2.4, 0, 7); g.fill(); }
      if(r2()<.18){ g.fillStyle='rgba(90,130,60,.6)'; g.beginPath(); g.ellipse(cx+24, cy+26, 9, 5, .6, 0, 7); g.fill(); }

  buildSpriteCache(); // рельеф сменился (старт/сезон) — перерендерить и спрайты под сезон
}

/* ---------- спрайты (процедурные, с вариациями) ---------- */
function shadow(g,x,y,rx,ry){ g.fillStyle='rgba(35,45,18,.30)'; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,7); g.fill(); }
function drawTreeSprite(g, type, x, y, s, seedv, sway){
  // type: 0 круглое, 1 сосна, 2 широкое
  shadow(g,x,y+2,13*s,4.5*s);
  const sw=Math.sin(sway+seedv)*1.6*s;
  g.strokeStyle='#7a5230'; g.lineWidth=4.4*s; g.beginPath(); g.moveTo(x,y+2); g.lineTo(x+sw*.4,y-12*s); g.stroke();
  // сезонные палитры листвы
  const pal=[['#4c8f3f','#5da34a','#3f7d34'],['#4c8f3f','#5da34a','#3f7d34'],['#c96f2e','#d98a35','#b3543f'],['#5d7a52','#6b8a5e','#4e6a45']][curSeason];
  const pal2=[['#5da34a','#6cb457','#4c8f3f'],['#5da34a','#6cb457','#4c8f3f'],['#d98a35','#e0a83e','#c96f2e'],['#6b8a5e','#7a9a6c','#5d7a52']][curSeason];
  if(type===1){
    g.fillStyle=pal[2];
    for(let i=0;i<3;i++){ const w=(17-i*4)*s, yy=y-(10+i*8)*s; g.beginPath(); g.moveTo(x+sw-w,yy); g.lineTo(x+sw,yy-13*s); g.lineTo(x+sw+w,yy); g.closePath(); g.fill(); }
    g.fillStyle='rgba(255,255,255,.13)'; g.beginPath(); g.moveTo(x+sw,y-36*s); g.lineTo(x+sw+5*s,y-24*s); g.lineTo(x+sw-1*s,y-24*s); g.closePath(); g.fill();
  } else {
    const cols= type===0? pal : pal2;
    const blobs= type===0? [[0,-24,13],[-9,-17,9],[9,-17,9]] : [[0,-21,15],[-11,-14,8],[11,-14,8],[0,-28,8]];
    // нижний тёмный слой кроны — объём в 3 слоя
    g.fillStyle=cols[2]; g.beginPath(); g.arc(x+sw, y-13*s, (type===0?12:14)*s, 0, 7); g.fill();
    blobs.forEach((b,i)=>{ g.fillStyle=cols[i%3]; g.beginPath(); g.arc(x+sw+b[0]*s, y+b[1]*s, b[2]*s, 0, 7); g.fill(); });
    g.fillStyle='rgba(255,255,255,.14)'; g.beginPath(); g.arc(x+sw-4*s, y-27*s, 5*s, 0, 7); g.fill();
    g.fillStyle='rgba(255,255,255,.20)'; g.beginPath(); g.arc(x+sw-6*s, y-24*s, 2.2*s, 0, 7); g.arc(x+sw+3*s, y-30*s, 1.7*s, 0, 7); g.fill();
    if(curSeason===3){ g.fillStyle='rgba(255,255,255,.75)'; g.beginPath(); g.arc(x+sw-2*s, y-29*s, 6*s, 0, 7); g.fill(); g.beginPath(); g.arc(x+sw+6*s, y-20*s, 4*s, 0, 7); g.fill(); }
    if(curSeason!==3 && seedv%5===0){ g.fillStyle='#d84f4f'; [[-6,-20],[5,-25],[1,-15]].forEach(p=>{ g.beginPath(); g.arc(x+sw+p[0]*s, y+p[1]*s, 1.9*s, 0, 7); g.fill(); }); }
  }
}
function drawBushSprite(g, x, y, s, seedv, ready){
  shadow(g,x,y+2,10*s,3.6*s);
  const cols= ready? ['#4c8f3f','#5da34a'] : ['#5d7a52','#6b8a5e'];
  g.fillStyle=cols[0]; g.beginPath(); g.arc(x-5*s, y-5*s, 6.5*s, 0, 7); g.arc(x+5*s, y-5*s, 6.5*s, 0, 7); g.arc(x, y-9*s, 7*s, 0, 7); g.fill();

    g.fillStyle='#c95fb4'; [[-6,-7],[6,-7]].forEach(p=>{ g.beginPath(); g.arc(x+p[0]*s, y+p[1]*s, .9*s, 0, 7); g.fill(); }); }

function drawRockSprite(g, x, y, s, seedv, mode){ // mode: 0 целая, 1 треснувшая (частичная добыча), 2 осколки (истощена)
  const broken=(mode===2), cracked=(mode===1);
  shadow(g,x,y+2,12*s,4*s);
  g.fillStyle= broken? '#9a958c' : '#a8a49b';
  g.beginPath();
  if(broken){ g.moveTo(x-11*s,y+1); g.lineTo(x-5*s,y-6*s); g.lineTo(x+1*s,y+1); g.lineTo(x+6*s,y-4*s); g.lineTo(x+11*s,y+1); }
  else { g.moveTo(x-12*s,y+1); g.lineTo(x-7*s,y-10*s); g.lineTo(x+1*s,y-14*s); g.lineTo(x+9*s,y-8*s); g.lineTo(x+12*s,y+1); }
  g.closePath(); g.fill();
  g.fillStyle='rgba(255,255,255,.28)'; g.beginPath(); g.moveTo(x-7*s,y-10*s); g.lineTo(x+1*s,y-14*s); g.lineTo(x+3*s,y-6*s); g.lineTo(x-3*s,y-5*s); g.closePath(); g.fill();
  g.fillStyle='rgba(0,0,0,.15)'; g.beginPath(); g.moveTo(x+3*s,y-6*s); g.lineTo(x+9*s,y-8*s); g.lineTo(x+12*s,y+1); g.lineTo(x+4*s,y+1); g.closePath(); g.fill();
  if(!broken){ // грань-скол и блик, рядом — мелкий камешек
    g.strokeStyle='rgba(70,66,60,.5)'; g.lineWidth=1.1*s; g.beginPath(); g.moveTo(x-2*s,y-3*s); g.lineTo(x+3*s,y-6*s); g.lineTo(x+2*s,y+1); g.stroke();
    g.fillStyle='rgba(255,255,255,.5)'; g.beginPath(); g.arc(x-5*s, y-11*s, 1.3*s, 0, 7); g.fill();
    g.fillStyle='#98938a'; g.beginPath(); g.ellipse(x+13*s, y+1, 3.4*s, 2*s, .3, 0, 7); g.fill(); }
  if(cracked){ // глубокие тёмные трещины через грань — видно, что камень уже били

    g.beginPath(); g.moveTo(x-6*s,y-11*s); g.lineTo(x-2*s,y-6*s); g.lineTo(x-4*s,y-1*s); g.moveTo(x-2*s,y-6*s); g.lineTo(x+3*s,y-4*s); g.lineTo(x+5*s,y+1); g.stroke();
    g.fillStyle='rgba(40,36,30,.32)'; g.beginPath(); g.ellipse(x+1*s, y-3*s, 3.4*s, 2*s, .4, 0, 7); g.fill(); }
}
function drawStump(g,x,y,s){
  shadow(g,x,y+2,8*s,3.4*s);
  g.fillStyle='#8a6238'; g.fillRect(x-5*s,y-6*s,10*s,8*s);
  g.fillStyle='#cfa96f'; g.beginPath(); g.ellipse(x,y-6*s,5*s,2.2*s,0,0,7); g.fill();
  g.strokeStyle='rgba(120,84,40,.7)'; g.beginPath(); g.ellipse(x,y-6*s,2.6*s,1.1*s,0,0,7); g.stroke();

  if(curSeason===3){ g.fillStyle='rgba(255,255,255,.85)'; g.beginPath(); g.ellipse(x,y-6.6*s,5.2*s,1.8*s,0,0,7); g.fill(); }
  else if(curSeason===2){ g.fillStyle='#c96f2e'; g.beginPath(); g.ellipse(x-7*s,y+1,2.6*s,1.3*s,.5,0,7); g.ellipse(x+7*s,y+1.6,2.2*s,1.1*s,-.4,0,7); g.fill(); }
  else if(curSeason===0){ g.strokeStyle='#5da34a'; g.lineWidth=1.3*s; g.beginPath(); g.moveTo(x+4*s,y-6*s); g.lineTo(x+5*s,y-10*s); g.stroke(); g.fillStyle='#6cb457'; g.beginPath(); g.arc(x+5.6*s,y-10.4*s,1.7*s,0,7); g.fill(); }
}

/* ---------- спрайт-кэш: «HD»-спрайты пререндерятся один раз, в кадре — только drawImage ---------- */
let spriteCache={};
function makeSprite(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  draw(c.getContext('2d'));
  return c;
}
function buildSpriteCache(){
  const keepNight=nightF; nightF=0; // кэш — дневной вид; ночные огни рисует рендер поверх
  const cache={};
  for(const type of BUILD_ORDER) for(let lvl=1;lvl<=3;lvl++){
    cache['b_'+type+'_'+lvl]=makeSprite(120,120,(g)=>drawBuildingSprite(g, type, lvl, 60, 64, 1, 3, 0));
  }
  for(let tp=0;tp<3;tp++) for(let fv=0;fv<5;fv++){
    cache['tree_'+tp+'_'+fv]=makeSprite(96,96,(g)=>drawTreeSprite(g, tp, 48, 58, 1, fv, 0));
  }
  cache['rock_0']=makeSprite(96,96,(g)=>drawRockSprite(g, 48, 50, 1, 0, 0));
  cache['rock_c']=makeSprite(96,96,(g)=>drawRockSprite(g, 48, 50, 1, 0, 1));
  cache['rock_1']=makeSprite(96,96,(g)=>drawRockSprite(g, 48, 50, .8, 0, 2));
  cache['bush_1']=makeSprite(96,96,(g)=>drawBushSprite(g, 48, 40, 1, 0, true));
  cache['bush_0']=makeSprite(96,96,(g)=>drawBushSprite(g, 48, 40, .92, 0, false));
  cache['stump']=makeSprite(64,64,(g)=>drawStump(g, 32, 24, 1));
  spriteCache=cache;
  nightF=keepNight;
}
function popScale(i){
  const bt=bornAt[i]; if(bt===undefined) return 1;
  const t=(worldTime-bt)/0.45;
  if(t>=1){ delete bornAt[i]; return 1; }
  if(t<=0) return .3;
  const c1=1.70158, c3=c1+1, u=t-1; // easeOutBack — мягкая пружинка
  return .3+.7*(1+c3*u*u*u+c1*u*u);
}
function drawCachedBuilding(type, level, cx, cy, i){
  const img=spriteCache['b_'+type+'_'+level];
  if(!img){ drawBuildingSprite(ctx, type, level, cx, cy, 1, 3, worldTime); return; }
  const p=popScale(i);
  if(p===1){ ctx.drawImage(img, cx-60, cy-64); return; }
  ctx.save(); ctx.translate(cx, cy+16); ctx.scale(p,p); ctx.drawImage(img, -60, -80); ctx.restore();
}

/* ---------- поселенцы-человечки ---------- */
function walkable(i){ const c=S.cells[i]; return c.t!=='water' || (c.b&&c.b.type==='bridge'); }
function bfsPath(si, ti){
  if(si===ti) return [si];
  const prev=new Array(W*H).fill(-2); prev[si]=-1; const q=[si];
  while(q.length){ const cur=q.shift(); if(cur===ti) break;
    const [cx,cy]=idxXY(cur);
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const nx=cx+dx, ny=cy+dy; if(nx<0||ny<0||nx>=W||ny>=H) continue; const ni=ny*W+nx;
      if(prev[ni]!==-2) continue; if(!walkable(ni)) continue; prev[ni]=cur; q.push(ni); } }
  if(prev[ti]===-2) return null;
  const path=[]; let c=ti; while(c!==-1){ path.push(c); c=prev[c]; } return path.reverse();
}
const AGENT_COLORS=['#b3543f','#4a6fa5','#5d8a48','#c9862b','#7a5195','#3f7d74','#a04a70'];
function syncAgents(){
  const houses=[], works=[];
  S.cells.forEach((c,i)=>{ if(!c.b) return; if(c.b.type==='house') houses.push(i); if(isProducer(c.b.type)) works.push(i); });
  const cap=popCapacity(S);
  const want=Math.min(cap, 14);
  while(agents.length>want) agents.pop();
  while(agents.length<want){ const h=houses.length? houses[agents.length%houses.length] : 0; const [hx,hy]=idxXY(h||0);
    agents.push({x:(hx+.5)*T, y:(hy+.5)*T, path:null, pi:0, wait:Math.random()*3, home:h, work:null, mode:'idle', color:AGENT_COLORS[agents.length%AGENT_COLORS.length], seed:Math.random()*10}); }
  agents.forEach((a,i)=>{ a.work = i<works.length ? works[i] : null;
    a.workRes = a.work!=null? (BUILDS[S.cells[a.work].b.type].outRes||null) : null;
    if(!houses.includes(a.home)) a.home=houses.length?houses[0]:-1; });
}
function agentGo(a, targetIdx){
  if(targetIdx<0) return;
  const cur=((a.y/T)|0)*W+((a.x/T)|0);
  const p=bfsPath(cur, targetIdx);
  if(p&&p.length>1){ a.path=p; a.pi=1; }
}
function updateAgents(dt){
  for(const a of agents){
    if(a.path&&a.pi<a.path.length){
      const ti=a.path[a.pi], [tx,ty]=idxXY(ti); const gx=(tx+.5)*T, gy=(ty+.5)*T;
      const dx=gx-a.x, dy=gy-a.y, d=Math.hypot(dx,dy);
      const curCell=S.cells[clamp((a.y/T)|0,0,H-1)*W+clamp((a.x/T)|0,0,W-1)];
      const sp=64*dt*((curCell.b&&curCell.b.type==='path')?1.6:1); // по дорожкам — быстрее
      if(d<3){ a.pi++; } else { a.x+=dx/d*sp; a.y+=dy/d*sp; }
      if(a.pi>=a.path.length) a.path=null;
    } else {
      a.wait-=dt;
      if(a.wait<=0){
        if(a.mode==='idle'){ a.mode='towork'; if(a.work!=null) agentGo(a,a.work); else { // житель гуляет рядом с домом
            const [hx,hy]=idxXY(a.home<0?0:a.home); const nx=clamp(hx+((Math.random()*5)|0)-2,0,W-1), ny=clamp(hy+((Math.random()*5)|0)-2,0,H-1);
            if(S.cells[ny*W+nx].t!=='water') agentGo(a, ny*W+nx); }
          a.wait=5+Math.random()*5; }
        else if(a.mode==='towork'){ a.mode='work'; a.wait=6+Math.random()*5; }
        else if(a.mode==='work'){ a.mode='tohome'; agentGo(a,a.home); a.wait=4; }
        else { a.mode='idle'; a.wait=3+Math.random()*4; }
      }
    }
  }
}
function drawResGlyph(g, res, x, y, s){
  if(res==='wood'){ g.fillStyle='#a5713d'; g.fillRect(x-5*s, y-2*s, 10*s, 4*s); g.fillStyle='#d9b878'; g.beginPath(); g.arc(x+5*s, y, 2*s, 0, 7); g.fill(); }
  else if(res==='food'){ g.fillStyle='#d84f4f'; g.beginPath(); g.arc(x, y, 3.6*s, 0, 7); g.fill(); g.fillStyle='#5da34a'; g.fillRect(x-.6*s, y-5.4*s, 1.2*s, 2*s); }
  else if(res==='honey'){ g.fillStyle='#e8a13c'; g.beginPath(); g.moveTo(x, y-4.4*s); g.quadraticCurveTo(x+3.4*s, y+1*s, x, y+3.6*s); g.quadraticCurveTo(x-3.4*s, y+1*s, x, y-4.4*s); g.fill(); }
  else if(res==='fish'){ g.fillStyle='#7fb3c8'; g.beginPath(); g.ellipse(x, y, 4.6*s, 2.2*s, -.4, 0, 7); g.fill(); g.beginPath(); g.moveTo(x+3.6*s, y); g.lineTo(x+6*s, y-2.6*s); g.lineTo(x+6*s, y+2.6*s); g.closePath(); g.fill(); }
}
function drawAgent(g,a,tNow){
  const bob=a.path? Math.abs(Math.sin(tNow*9+a.seed))*2 : Math.sin(tNow*2+a.seed)*.6;
  g.fillStyle='rgba(40,50,20,.25)'; g.beginPath(); g.ellipse(a.x, a.y+7, 5.5, 2.2, 0, 0, 7); g.fill();
  if(a.path){ // ножки при ходьбе
    g.strokeStyle='#4a3620'; g.lineWidth=1.7; const lp=Math.sin(tNow*9+a.seed)*3;
    g.beginPath(); g.moveTo(a.x, a.y+3-bob); g.lineTo(a.x-2+lp*.5, a.y+7); g.moveTo(a.x, a.y+3-bob); g.lineTo(a.x+2-lp*.5, a.y+7); g.stroke(); }
  g.fillStyle=a.color; g.beginPath(); g.arc(a.x, a.y-bob, 5.6, 0, 7); g.fill();           // тело
  g.fillStyle='#f2c894'; g.beginPath(); g.arc(a.x, a.y-7-bob, 3.6, 0, 7); g.fill();        // голова
  g.fillStyle='rgba(74,54,32,.9)'; g.beginPath(); g.arc(a.x, a.y-8.6-bob, 3.6, 3.4, 6.1); g.fill(); // шапка волос
  if(a.mode==='work'&&a.workRes){ // анимация работы: инструмент качается над головой
    const sw=Math.sin(tNow*7+a.seed)*0.7;
    g.save(); g.translate(a.x+6, a.y-11-bob); g.rotate(sw);
    g.fillStyle='#8a8f96'; g.fillRect(-1,-6,2.4,6); g.fillStyle='#7a5230'; g.fillRect(-.8,0,1.8,4.6); g.restore(); }
  if(a.mode==='tohome'&&a.workRes){ // несёт добычу в склад — значок ресурса над головой
    g.fillStyle='rgba(244,231,200,.92)'; g.beginPath(); g.arc(a.x, a.y-16-bob, 6.4, 0, 7); g.fill();
    g.strokeStyle='#a97f45'; g.lineWidth=1; g.stroke();
    drawResGlyph(g, a.workRes, a.x, a.y-16-bob, .85); }
}

/* ============================================================
   ИГРОВАЯ ЛОГИКА
   ============================================================ */
function canAfford(cost){ for(const k in cost) if(S.res[k]<cost[k]) return false; return true; }
function payCost(cost){ for(const k in cost) S.res[k]-=cost[k]; }
function addRes(res, amt, x, y){
  const cap=resCap(S); const before=S.res[res]; S.res[res]=Math.min(cap, S.res[res]+amt);
  const real=S.res[res]-before;
  if(real>0){
    S.stats.totalGot+=real;
    if(res==='wood') S.stats.gotWood+=real;
    if(res==='food') S.stats.gotFood+=real;
    if(res==='fish') S.stats.gotFish+=real;
    if(res==='berries') S.stats.gotBerries+=real;
    if(res==='honey') S.stats.gotHoney+=real;
  }
  if(x!==undefined&&real>0) floater(x, y-26, '+'+Math.round(real)+' '+RES_NAMES[res], RES_COLORS[res]);
  if(real<amt&&x!==undefined) toast('Склад полон! Постройте Склад, чтобы хранить больше.', 'err');
  return real;
}
const RES_NAMES={wood:'дерева', stone:'камня', food:'еды', fish:'рыбы', berries:'ягод', honey:'мёда'};
const RES_PLURAL={wood:'Дерево', stone:'Камень', food:'Еда', fish:'Рыба', berries:'Ягоды', honey:'Мёд'};
const RES_COLORS={wood:'#ffe1a8', stone:'#e8e8e8', food:'#ffd9a8', fish:'#bfe6f5', berries:'#f0b8e6', honey:'#ffd76a'};
function shoreOK(i){ const [x,y]=idxXY(i); for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){ const c=cellAt(x+dx,y+dy); if(!c||c.t==='water') return true; } return false; }
function canPlace(type, i){
  const c=S.cells[i]; if(!c||c.b||c.n) return false;
  const d=BUILDS[type];
  if(d.terrain==='bridge'){ return c.t==='water' && shoreOK(i); }
  if(c.t==='water') return false;
  if(d.terrain==='grass'&&c.t!=='grass') return false;
  if(d.terrain==='shore'&&!shoreOK(i)) return false;
  return true;
}
function placeError(type, i){
  const c=S.cells[i]; if(!c) return 'За пределами острова';
  const d=BUILDS[type];
  if(d.terrain==='bridge'){
    if(c.t!=='water') return 'Мост строится на воде рядом с берегом';
    if(c.b) return 'Клетка уже занята';
    if(!shoreOK(i)) return 'Рядом с клеткой моста должна быть суша';
    return 'Здесь мост не построить';
  }
  if(c.t==='water') return 'Нельзя строить в воде';
  if(c.b) return 'Клетка уже занята';
  if(c.n) return 'Сначала уберите дерево, камень или куст';
  if(d.terrain==='grass'&&c.t!=='grass') return 'Сюда нужно на траву';
  if(d.terrain==='shore'&&!shoreOK(i)) return 'Причал строится на берегу — нужна вода рядом';
  return 'Здесь построить нельзя';
}
function buildLock(type){ // null — можно строить; строка — причина блокировки
  const d=BUILDS[type];
  if(d.reqLevel && S.level<d.reqLevel) return 'Откроется на уровне «'+TOWN_LEVELS[d.reqLevel].name+'»';
  if(d.limit && countB(S,type)>=d.limit) return 'Уже построено (одна на остров)';
  return null;
}
function tryBuild(type, i){
  const d=BUILDS[type];
  const lock=buildLock(type);
  if(lock){ toast(lock,'err'); Sound.err(); return false; }
  if(!canPlace(type,i)){ toast(placeError(type,i),'err'); Sound.err(); return false; }
  if(!canAfford(d.cost)){ toast('Не хватает ресурсов: '+costText(d.cost),'err'); Sound.err(); return false; }
  if(d.worker && workersUsed(S)>=popCapacity(S)){ toast('Нет свободных поселенцев — сначала постройте Дом.','err'); Sound.err(); return false; }
  payCost(d.cost);
  const c=S.cells[i];
  c.b={type, level:1, prog:0, ready:false, pt:0, damaged:false};
  bornAt[i]=worldTime;
  S.stats.builtTotal++;
  if(c.isl>0) S.stats.builtSatellite=Math.max(S.stats.builtSatellite,1);
  const [x,y]=idxXY(i);
  burst((x+.5)*T,(y+.5)*T,'dust',10);
  Sound.build();
  toast(d.name+' построен!');
  addChron('Построено: '+d.name.toLowerCase()+(c.isl>0?' (на островке)':'')+'.');
  syncAgents(); afterChange(); checkQuests(); checkAchs();
  selectCell(i);
  return true;
}
function hitNode(i){
  const c=S.cells[i]; if(!c.n||c.nh<=0) return;
  const [x,y]=idxXY(i); const wx=(x+.5)*T, wy=(y+.5)*T;
  if(c.n==='bush'){ // ягоды: один клик, долгое восстановление
    c.nh=0; c.nr=45;
    addRes('berries',3,wx,wy); burst(wx,wy-10,'spark',7); Sound.play('gatherBerry');
    floater(wx,wy-36,'Куст отдохнёт 45 c','#ffeeda');
    refreshSelCard(); afterChange(); checkQuests(); checkAchs(); return;
  }
  c.nh--;
  if(c.n==='tree'){ addRes('wood',2,wx,wy); burst(wx,wy-16,'leaf',8); Sound.chop(); }
  else { addRes('stone',2,wx,wy); S.stats.minedStone+=2; burst(wx,wy-8,'dust',8); Sound.hit(); }
  if(c.nh<=0){ c.nr=20; Sound.play('depleteNode'); floater(wx,wy-34, c.n==='tree'?'Пенёк отдохнёт 20 c':'Восстановится за 20 c','#ffeeda'); }
  refreshSelCard(); afterChange(); checkQuests(); checkAchs();
}
function collectBuilding(i){
  const c=S.cells[i]; if(!c.b) return;
  const b=c.b, d=BUILDS[b.type]; const [x,y]=idxXY(i); const wx=(x+.5)*T, wy=(y+.5)*T;
  if(isProducer(b.type)&&b.ready&&!b.damaged){
    const def=prodDef(b.type,b.level);
    const got=addRes(d.outRes, def.out, wx, wy);
    if(got>0){ if(b.type==='farm')S.stats.farmHarvests++; b.ready=false; b.prog=0; Sound.collect(); burst(wx,wy-14,'spark',8); }
    refreshSelCard(); afterChange(); checkQuests(); checkAchs();
  }
}
const REPAIR_COST={wood:10};
function repairBuilding(i){
  const c=S.cells[i]; if(!c.b||!c.b.damaged) return;
  if(!canAfford(REPAIR_COST)){ toast('Не хватает ресурсов: '+costText(REPAIR_COST),'err'); Sound.err(); return; }
  payCost(REPAIR_COST); c.b.damaged=false; c.b.prog=0;
  const [x,y]=idxXY(i); burst((x+.5)*T,(y+.4)*T,'spark',10);
  Sound.build(); toast(BUILDS[c.b.type].name+' отремонтирован!');
  addChron('Отремонтировано после бури: '+BUILDS[c.b.type].name.toLowerCase()+'.');
  refreshSelCard(); afterChange();
}
function upgradeBuilding(i){
  const c=S.cells[i]; if(!c.b) return;
  const b=c.b; const ups=UPG[b.type]; if(!ups||b.level>=3) return;
  const u=ups[b.level]; if(!u) return;
  if(!canAfford(u.cost)){ toast('Не хватает ресурсов: '+costText(u.cost),'err'); Sound.err(); return; }
  payCost(u.cost); b.level++;
  S.stats.upgrades++; S.stats.maxLevel=Math.max(S.stats.maxLevel,b.level);
  const [x,y]=idxXY(i); burst((x+.5)*T,(y+.4)*T,'spark',14);
  Sound.play('upgrade'); toast(BUILDS[b.type].name+' улучшен до уровня '+b.level+'!');
  syncAgents(); refreshSelCard(); afterChange(); checkQuests(); checkAchs();
}
function demolishBuilding(i){ // подтверждение сноса
  const c=S.cells[i]; if(!c.b) return;
  const d=BUILDS[c.b.type];
  const back=Object.keys(d.cost).map(k=>Math.floor(d.cost[k]/2)+' '+RES_NAMES[k]).join(', ');
  showModal('<h2>Снести: '+d.name+'?</h2><p>Здание исчезнет, а половина материалов вернётся на склад: <b>'+back+'</b>.</p><div class="mbtns">'+
   '<button class="btn danger" id="d-yes">Да, снести</button><button class="btn" id="d-no">Отмена</button></div>');
  $('d-yes').onclick=()=>{ closeModal(); doDemolish(i); };
  $('d-no').onclick=closeModal;
}
function doDemolish(i){
  const c=S.cells[i]; if(!c.b) return;
  const d=BUILDS[c.b.type];
  if(c.b.type==='house' && popCapacity(S)-houseCap(c.b.level) < workersUsed(S)){ toast('Нельзя снести: работникам негде будет жить.','err'); Sound.err(); return; }
  for(const k in d.cost) S.res[k]=Math.min(resCap(S), S.res[k]+Math.floor(d.cost[k]/2));
  const [x,y]=idxXY(i); burst((x+.5)*T,(y+.5)*T,'dust',12);
  c.b=null; Sound.play('demolish'); toast(d.name+' снесён, половина материалов возвращена.');
  addChron('Снесено: '+d.name.toLowerCase()+'.');
  if(moveFrom===i) moveFrom=-1;
  selIdx=-1; $('selcard').classList.remove('open');
  syncAgents(); afterChange(); checkAchs();
}
const MOVE_COST={wood:5};
function startMove(i){
  if(!canAfford(MOVE_COST)){ toast('Не хватает ресурсов: '+costText(MOVE_COST),'err'); Sound.err(); return; }
  moveFrom=i; selIdx=-1; $('selcard').classList.remove('open');
  toast('Режим переезда: кликните по свободной клетке, куда перенести здание (5 дерева). Esc — отмена.');
}
function tryMove(i){
  const from=S.cells[moveFrom]; if(!from||!from.b){ moveFrom=-1; return; }
  const type=from.b.type;
  if(!canPlace(type,i)){ toast(placeError(type,i),'err'); Sound.err(); return; }
  if(!canAfford(MOVE_COST)){ toast('Не хватает ресурсов: '+costText(MOVE_COST),'err'); Sound.err(); moveFrom=-1; return; }
  payCost(MOVE_COST);
  S.cells[i].b=from.b; from.b=null;
  if(S.cells[i].isl>0) S.stats.builtSatellite=Math.max(S.stats.builtSatellite,1);
  const [x,y]=idxXY(i); burst((x+.5)*T,(y+.5)*T,'dust',10);
  Sound.build(); toast(BUILDS[type].name+' переехал!');
  addChron('Переезд: '+BUILDS[type].name.toLowerCase()+' на новое место.');
  moveFrom=-1; syncAgents(); afterChange(); selectCell(i);
}

/* ---------- задания и достижения ---------- */
function questDone(q){ return q.goals(S).every(g=>g[1]>=g[2]); }
function checkQuests(){
  let guard=0;
  while(S.quest<QUESTS.length && guard++<12){
    const q=QUESTS[S.quest]; if(!questDone(q)) break;
    S.quest++;
    const parts=[]; for(const k in q.reward){ const real=Math.min(resCap(S),S.res[k]+q.reward[k])-S.res[k]; S.res[k]+=real; parts.push('+'+q.reward[k]+' '+RES_NAMES[k]); }
    toast('Задание «'+q.name+'» выполнено! Награда: '+parts.join(', '), 'gold');
    addChron('Задание выполнено: «'+q.name+'». Награда: '+parts.join(', ')+'.');
    Sound.quest(); confetti(S.cam.x, S.cam.y-40);
    renderQuests(); updateResBar(); saveSoon();
    if(q.id==='flower'&&!S.victory){ S.victory=true; setTimeout(showVictory, 700); }
  }
  $('quest-dot').style.display = (S.quest<QUESTS.length&&questDone(QUESTS[S.quest]))? 'flex':'none';
}
function checkAchs(){
  for(const a of ACHS){ if(!S.ach.includes(a.id)&&a.test(S)){ S.ach.push(a.id); toast('Медальон: «'+a.name+'»','gold'); Sound.ach(); renderAchs(); saveSoon(); } }
}
function checkLevel(){
  const nl=settlementLevel(S);
  if(nl>S.level){
    S.level=nl;
    const t=TOWN_LEVELS[nl];
    addChron('Поселение выросло: теперь это «'+t.name+'»!');
    setTimeout(()=>{ showModal('<h2>Новый уровень: '+t.name+'!</h2><p>Поселение выросло — жителей уже '+popCapacity(S)+', построек '+totalBuildings(S)+'. '+
      (nl===1?'Открыты Ратуша и Рынок.': nl===2?'Открыта Пасека — пчёлы и мёд уже ждут.': nl===3?'Высший уровень: настоящий порт! Маяк гордо светит кораблям.':'')+
      '</p><div class="mbtns"><button class="btn primary" id="lv-ok">Ура!</button></div>');
      $('lv-ok').onclick=closeModal; confetti(S.cam.x, S.cam.y-40); Sound.play('levelUp'); }, 350);
    saveSoon();
  }
}
/* ---------- ежедневные задания ---------- */
const DAILY_POOL=[
 {kind:'gotWood',   label:'Добыть дерева',        stat:S=>S.stats.gotWood,      needs:[30,45,60], reward:{res:'food', amt:12}},
 {kind:'minedStone',label:'Добыть камня',         stat:S=>S.stats.minedStone,   needs:[24,36,48], reward:{res:'wood', amt:14}},
 {kind:'gotFood',   label:'Собрать еды',          stat:S=>S.stats.gotFood,      needs:[20,30,40], reward:{res:'stone', amt:12}},
 {kind:'gotFish',   label:'Поймать рыбы',         stat:S=>S.stats.gotFish,      needs:[10,16,24], reward:{res:'wood', amt:12}},
 {kind:'gotBerries',label:'Собрать ягод',         stat:S=>S.stats.gotBerries,   needs:[9,15,21],  reward:{res:'food', amt:10}},
 {kind:'built',     label:'Построить зданий',     stat:S=>S.stats.builtTotal,   needs:[1,2,3],    reward:{res:'stone', amt:14}},
 {kind:'harvest',   label:'Собрать урожаев фермы',stat:S=>S.stats.farmHarvests, needs:[2,3,4],    reward:{res:'wood', amt:12}}
];
function genDaily(){
  const date=todayStr();
  let h=0; for(const ch of date) h=(h*31+ch.charCodeAt(0))>>>0;
  const rnd=mulberry32(h^0xDA11);
  const pool=DAILY_POOL.slice(); const list=[];
  for(let i=0;i<3;i++){
    const p=pool.splice((rnd()*pool.length)|0,1)[0];
    const tier=(rnd()*p.needs.length)|0;
    list.push({kind:p.kind, label:p.label, need:p.needs[tier], base:p.stat(S), reward:p.reward, done:false});
  }
  S.daily={date, list};
}
function dailyStat(kind){ const p=DAILY_POOL.find(x=>x.kind===kind); return p? p.stat(S):0; }
function ensureDaily(){ if(!S.daily||S.daily.date!==todayStr()){ genDaily(); renderQuests(); saveSoon(); } }
function checkDaily(){
  if(!S.daily) return;
  for(const q of S.daily.list){
    if(q.done) continue;
    if(dailyStat(q.kind)-q.base>=q.need){
      q.done=true;
      const real=Math.min(resCap(S), S.res[q.reward.res]+q.reward.amt)-S.res[q.reward.res]; S.res[q.reward.res]+=real;
      toast('Ежедневное задание «'+q.label+'» выполнено! +'+q.reward.amt+' '+RES_NAMES[q.reward.res], 'gold');
      addChron('Ежедневное задание: «'+q.label+'» — награда +'+q.reward.amt+' '+RES_NAMES[q.reward.res]+'.');
      Sound.quest(); renderQuests(); updateResBar(); saveSoon();
    }
  }
}
/* ---------- торговец и случайные события ---------- */
function traderArrive(){
  S.trader={offers:genShipOffers(), t:60};
  $('btn-trader').style.display='flex';
  toast('К причалу подошёл торговый корабль! Предложения действуют 60 секунд.', 'gold');
  Sound.play('shipHorn');
  addChron('Торговый корабль у причала: 3 предложения обмена.');

}
function traderLeave(silent){
  S.trader=null; $('btn-trader').style.display='none';
  if(!silent){ toast('Торговец уплыл. В следующий раз повезёт больше!'); addChron('Торговец уплыл без сделок.'); }

}
function doShipTrade(ix){
  if(!S.trader) return;
  const o=S.trader.offers[ix]; if(!o) return;
  if(S.res[o.give]<o.amt){ toast('Не хватает: нужно '+o.amt+' '+RES_NAMES[o.give]+'.','err'); Sound.err(); return; }
  const room=resCap(S)-S.res[o.get];
  if(room<=0){ toast('Склад полон — некуда класть '+RES_NAMES[o.get]+'.','err'); Sound.err(); return; }
  S.res[o.give]-=o.amt; S.res[o.get]+=Math.min(o.recv, room);
  S.stats.trades++;
  toast('Сделка! −'+o.amt+' '+RES_NAMES[o.give]+' → +'+Math.min(o.recv,room)+' '+RES_NAMES[o.get], 'gold');
  addChron('Торг с кораблём: '+o.amt+' '+RES_NAMES[o.give]+' → '+Math.min(o.recv,room)+' '+RES_NAMES[o.get]+'.');
  Sound.play('coin');
  S.trader.offers.splice(ix,1);
  if(!S.trader.offers.length) traderLeave(true); else showTrader();
  afterChange(); checkAchs();
}
function fireEvent(){
  S.stats.eventsSeen++;
  const roll=Math.random();
  const buildings=[]; S.cells.forEach((c,i)=>{ if(c.b&&c.b.type!=='path'&&c.b.type!=='bridge') buildings.push(i); });
  if(roll<0.28 && buildings.length){ // буря
    const i=buildings[(Math.random()*buildings.length)|0]; const c=S.cells[i];
    if(!c.b.damaged){ c.b.damaged=true; c.b.ready=false;
      toast('Буря повредила здание: '+BUILDS[c.b.type].name+'! Откройте его карточку и почините за 10 дерева.', 'err');
      addChron('Буря повредила здание: '+BUILDS[c.b.type].name.toLowerCase()+'. Нужен ремонт.');
      Sound.play('thunder'); refreshSelCard(); saveSoon(); return; }
  }
  if(roll<0.52){ // странник — только если есть где жить сверх занятых мест
    if(popCapacity(S)>workersUsed(S)){
      showModal('<h2>Странник у причала</h2><p>Усталый путник просит разрешения остаться жить на острове. Если примете — поселение получит <b>+1 место жителя</b> навсегда (странник поможет, где сможет).</p><div class="mbtns">'+
       '<button class="btn primary" id="w-yes">Принять странника</button><button class="btn" id="w-no">Отказать</button></div>');
      $('w-yes').onclick=()=>{ S.bonusCap++; closeModal(); toast('Странник остался! Мест жителей: '+popCapacity(S), 'gold'); addChron('Странник остался жить на острове (+1 место жителя).'); syncAgents(); afterChange(); Sound.quest(); };
      $('w-no').onclick=()=>{ closeModal(); toast('Странник поблагодарил и уплыл дальше.'); addChron('Страннику отказали — он уплыл дальше.'); };
      return;
    }
  }
  if(roll<0.76){ // богатый улов
    const got=addRes('fish', 10+((Math.random()*8)|0), S.cam.x, S.cam.y-30);
    toast('Богатый улов! Рыбаки принесли +'+Math.round(got)+' рыбы.', 'gold');
    addChron('Богатый улов: +'+Math.round(got)+' рыбы.');
